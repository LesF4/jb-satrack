<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype · Bandeau télémétrie live — JB-SATRACK</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/picker.css">
<style>
  .mock-panel{
    border:1px solid var(--panel-line); border-radius:12px; overflow:hidden; background:#070c17;
  }
  .mock-map{
    height:300px; display:flex; align-items:center; justify-content:center;
    color:var(--ink-2); font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    background:
      linear-gradient(180deg, rgba(17,26,44,.5), rgba(7,12,23,.2)),
      repeating-linear-gradient(0deg, transparent 0 39px, rgba(75,227,199,.05) 39px 40px),
      repeating-linear-gradient(90deg, transparent 0 39px, rgba(75,227,199,.05) 39px 40px);
  }

  /* ================================================================ EFIS
     Axe : barre d'instrument plate, pilotée par l'alignement.
     Valeurs alignées sur une même ligne de base, unité en exposant discret,
     label micro-capitales au-dessus, filets de colonne fins, la cellule live
     souligne en phosphore au lieu de colorer le chiffre. */
  .v-efis{
    display:grid; grid-template-columns:repeat(6,1fr); border-top:1px solid var(--panel-line);
    animation:fade-in 130ms ease-out both;
  }
  @keyframes fade-in{ from{opacity:0;} to{opacity:1;} }
  @media (max-width:820px){ .v-efis{grid-template-columns:repeat(3,1fr);} }
  .v-efis .c{padding:11px 14px 12px; border-right:1px solid rgba(30,44,70,.7);}
  .v-efis .c:nth-child(6n){border-right:none;}
  @media (max-width:820px){ .v-efis .c:nth-child(3n){border-right:none;} }
  .v-efis .k{font-family:var(--mono); font-size:9px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-2);}
  .v-efis .v{
    font-family:var(--mono); font-size:18px; color:var(--ink-0); margin-top:6px;
    font-variant-numeric:tabular-nums; display:flex; align-items:baseline; gap:3px;
  }
  .v-efis .v sup{font-size:9px; color:var(--ink-2); font-variant-numeric:normal; top:-.1em;}
  .v-efis .c.live .v{position:relative;}
  .v-efis .c.live .v::after{
    content:""; position:absolute; left:0; right:30%; bottom:-4px; height:2px;
    background:var(--phosphor); box-shadow:0 0 8px var(--phosphor);
  }

  /* ================================================================ TILES
     Axe : tuiles bordées autonomes. Chaque lecture est une petite carte,
     rythme vertical plus généreux, la tuile live prend un liseré phosphore
     et une pastille qui pulse. Meilleure tenue en écran étroit. */
  .v-tiles{
    display:grid; grid-template-columns:repeat(6,1fr); gap:8px; padding:12px;
    border-top:1px solid var(--panel-line);
    animation:fade-in 130ms ease-out both;
  }
  @media (max-width:980px){ .v-tiles{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:560px){ .v-tiles{grid-template-columns:repeat(2,1fr);} }
  .v-tiles .c{
    border:1px solid var(--panel-line); border-radius:8px; padding:10px 12px;
    background:rgba(255,255,255,.015);
  }
  .v-tiles .c.live{
    border-color:var(--phosphor-dim);
    box-shadow:0 0 0 1px rgba(75,227,199,.25), 0 0 22px rgba(75,227,199,.12);
  }
  .v-tiles .k{
    font-family:var(--mono); font-size:9px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-2);
    display:flex; align-items:center; gap:6px;
  }
  .v-tiles .c.live .k::before{
    content:""; width:6px; height:6px; border-radius:50%; background:var(--phosphor);
    box-shadow:0 0 8px var(--phosphor); animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.45; transform:scale(.8);} }
  @media (prefers-reduced-motion: reduce){ .v-tiles .c.live .k::before{animation:none;} }
  .v-tiles .v{font-family:var(--mono); font-size:19px; color:var(--ink-0); margin-top:8px; font-variant-numeric:tabular-nums;}
  .v-tiles .v small{font-size:10px; color:var(--ink-2); margin-left:3px;}
  .v-tiles .c.live .v{color:var(--phosphor);}

  /* ================================================================ VIZ
     Axe : chiffre augmenté d'un mini-visuel. Barre de remplissage pour
     l'altitude, flèche signée pour la vitesse radiale, tick de compas pour
     l'azimut, chevron pour le signe d'élévation, pastille pleine/creuse pour
     la visibilité. Le brut devient scannable. */
  .v-viz{
    display:grid; grid-template-columns:repeat(6,1fr); border-top:1px solid var(--panel-line);
    animation:fade-in 130ms ease-out both;
  }
  @media (max-width:820px){ .v-viz{grid-template-columns:repeat(3,1fr);} }
  .v-viz .c{padding:11px 14px; border-right:1px solid rgba(30,44,70,.7);}
  .v-viz .c:nth-child(6n){border-right:none;}
  @media (max-width:820px){ .v-viz .c:nth-child(3n){border-right:none;} }
  .v-viz .k{font-family:var(--mono); font-size:9px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-2);}
  .v-viz .v{font-family:var(--mono); font-size:17px; color:var(--ink-0); margin-top:4px; font-variant-numeric:tabular-nums;}
  .v-viz .v small{font-size:10px; color:var(--ink-2); margin-left:3px;}
  .v-viz .c.live .v{color:var(--phosphor);}
  .v-viz .viz{margin-top:7px; height:14px; display:flex; align-items:center;}
  .v-viz .track{position:relative; width:100%; height:3px; border-radius:2px; background:rgba(75,227,199,.14);}
  .v-viz .track i{position:absolute; left:0; top:0; bottom:0; border-radius:2px; background:var(--phosphor); box-shadow:0 0 8px rgba(75,227,199,.5);}
  .v-viz .arrow{font-family:var(--mono); font-size:11px; color:var(--amber); letter-spacing:.1em;}
  .v-viz .compass{width:14px; height:14px; border:1px solid rgba(75,227,199,.35); border-radius:50%; position:relative;}
  .v-viz .compass i{position:absolute; left:50%; top:50%; width:1px; height:7px; background:var(--phosphor); transform-origin:bottom center;}
  .v-viz .chev{font-family:var(--mono); font-size:12px; color:#8ab4ff;}
  .v-viz .vis-dot{width:9px; height:9px; border-radius:50%;}
  .v-viz .vis-dot.on{background:var(--good); box-shadow:0 0 10px var(--good);}
  .v-viz .vis-dot.off{border:1px solid var(--ink-2);}
</style>
</head>
<body>

<div class="proto-context">
  <div class="proto-lead">Prototype · bandeau télémétrie, attaché sous la carte dans le même panneau · passage en cours (satellite AUDIBLE)</div>
  <div class="mock-panel">
    <div class="mock-map">Carte temps réel</div>
    <div id="stage"></div>
  </div>
</div>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">EFIS</button>
  <button class="proto-picker-item">Tiles</button>
  <button class="proto-picker-item">Viz</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Rejouer l'animation (R)">↻</button>
</nav>

<script>
var variants = [
  /* 1 — EFIS */ function () { return `
    <div class="v-efis">
      <div class="c live"><div class="k">Distance</div><div class="v">1 148 <sup>km</sup></div></div>
      <div class="c"><div class="k">Vitesse</div><div class="v">27 400 <sup>km/h</sup></div></div>
      <div class="c"><div class="k">Altitude</div><div class="v">782 <sup>km</sup></div></div>
      <div class="c"><div class="k">Position sat</div><div class="v">48.9°N 6.1°E</div></div>
      <div class="c"><div class="k">Azimut / Élév.</div><div class="v">118° / 24.3°</div></div>
      <div class="c"><div class="k">Visibilité</div><div class="v">AUDIBLE</div></div>
    </div>`; },

  /* 2 — Tiles */ function () { return `
    <div class="v-tiles">
      <div class="c live"><div class="k">Distance</div><div class="v">1 148<small>km</small></div></div>
      <div class="c"><div class="k">Vitesse</div><div class="v">27 400<small>km/h</small></div></div>
      <div class="c"><div class="k">Altitude</div><div class="v">782<small>km</small></div></div>
      <div class="c"><div class="k">Position sat</div><div class="v">48.9°N 6.1°E</div></div>
      <div class="c"><div class="k">Azimut / Élév.</div><div class="v">118° / 24.3°</div></div>
      <div class="c"><div class="k">Visibilité</div><div class="v">AUDIBLE</div></div>
    </div>`; },

  /* 3 — Viz */ function () { return `
    <div class="v-viz">
      <div class="c live"><div class="k">Distance</div><div class="v">1 148 <small>km</small></div>
        <div class="viz"><div class="track"><i style="width:34%"></i></div></div></div>
      <div class="c"><div class="k">Vitesse radiale</div><div class="v">−7.1 <small>km/s</small></div>
        <div class="viz"><span class="arrow">◀ se rapproche</span></div></div>
      <div class="c"><div class="k">Altitude</div><div class="v">782 <small>km</small></div>
        <div class="viz"><div class="track"><i style="width:65%"></i></div></div></div>
      <div class="c"><div class="k">Position sat</div><div class="v">48.9°N 6.1°E</div>
        <div class="viz"></div></div>
      <div class="c"><div class="k">Azimut / Élév.</div><div class="v">118° / 24.3°</div>
        <div class="viz"><span class="compass"><i style="transform:translate(-50%,-100%) rotate(118deg)"></i></span>
        <span class="chev" style="margin-left:8px">▲ monte</span></div></div>
      <div class="c live"><div class="k">Visibilité</div><div class="v">AUDIBLE</div>
        <div class="viz"><span class="vis-dot on"></span></div></div>
    </div>`; }
];
</script>
<script src="assets/picker.js"></script>
</body>
</html>
