<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype · Lecture — par quoi la page s'oriente</title>
<link rel="stylesheet" href="assets/picker.css">
<link rel="stylesheet" href="../data/vendor/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Martian+Mono:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap">
<style>
/* =========================================================================
   LECTURE — structure « Mixte » actée. L'axe du sélecteur est désormais :
   PAR QUOI LA PAGE S'ORIENTE, c'est-à-dire ce qu'un opérateur comprend dans
   les trois premières secondes. Ce n'est plus une question de style.

   Cinq règles posées, valables dans les trois propositions :

   1. RYTHME SYMÉTRIQUE. Un bloc est une colonne flex avec UN seul `gap`. Les
      séparateurs sont des éléments à part entière : l'espace est donc
      forcément identique au-dessus et en dessous. Aucune marge orpheline
      n'est plus possible — c'était la cause de « marge en haut, pas en bas ».

   2. UNE SEULE FAMILLE DE FORMES. Tout ce qui se clique ou s'étiquette est
      une pilule ; toute surface est un rectangle arrondi. Le bouton carré à
      côté du tag arrondi était un accident, pas un parti.

   3. L'ACCENT SE MÉRITE. La télémétrie n'est plus accentuée au hasard :
      seule « Visibilité » l'est, et seulement quand elle vaut « Audible ».
      C'est la seule des six lectures qui change ce que tu fais — les cinq
      autres sont des mesures, elles n'ont aucune raison de crier.

   4. UNE PHRASE D'ORIENTATION. En tête, en français, ce qui se passe et ce
      qu'il faut en faire. C'est ce qui manquait pour savoir « où on est ».

   5. LE PLUS IMPORTANT D'ABORD. La carte disait « où » avant que quoi que ce
      soit ait dit « quoi ». L'ordre est inversé.
   ========================================================================= */
*{box-sizing:border-box;}
html,body{margin:0; padding:0;}
body{background:#09090b; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; font-synthesis:none;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }
.proto-lead{font:11px/1.5 ui-monospace,monospace; letter-spacing:.06em; color:#5d5d64; padding:12px 18px 0;}
#stage{min-height:100vh;}

.lc{
  --pad:.8; --gap:1.4;
  --p1:calc(4px*var(--pad));  --p2:calc(8px*var(--pad));  --p3:calc(12px*var(--pad));
  --p4:calc(16px*var(--pad)); --p5:calc(22px*var(--pad)); --p6:calc(30px*var(--pad));
  --g:calc(16px*var(--gap)); --g2:calc(30px*var(--gap)); --g3:calc(52px*var(--gap));
  /* règle 2 — une seule famille de formes */
  --r-surface:10px; --r-field:8px; --r-control:999px;
  background:var(--bg); color:var(--i0); font-family:var(--sans);
  min-height:100vh; padding:var(--g) clamp(12px,2.4vw,34px) calc(var(--g3) * 2);
}
.lc .page{max-width:1560px; margin:0 auto; display:flex; flex-direction:column; gap:var(--g2);}

/* règle 1 — rythme symétrique. Le séparateur est un élément, pas une bordure. */
.lc .block{display:flex; flex-direction:column; gap:var(--p5);}
.lc .sep{border:0; border-top:1px solid var(--line); margin:0; height:0; width:100%;}
.lc .framed{background:var(--surf); box-shadow:0 0 0 1px var(--line);
  border-radius:var(--r-surface); padding:var(--p5); overflow:hidden;}

/* ------------------------------------------------------------ typographie */
.lc h2{margin:0; font-size:14px; font-weight:600; letter-spacing:-.01em; color:var(--i0);
  display:flex; align-items:center; gap:var(--p2); padding-bottom:var(--p3); border-bottom:1px solid var(--line);}
.lc .framed h2{border-bottom:0; padding-bottom:0;}
.lc h2 .ic{font-size:15px; color:var(--i2);}
.lc h2 .meta{margin-left:auto; font-weight:400;}
.lc .act{font-size:11px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--i2);
  display:flex; align-items:center; gap:var(--p3);}
.lc .act::after{content:""; flex:1; height:1px; background:var(--line);}
.lc .lab{font-size:10px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--i2);
  display:flex; align-items:center; gap:6px;}
.lc .lab .ic{font-size:12px;}
.lc .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em; color:var(--i0);}
.lc .prose{font-size:13px; line-height:1.65; color:var(--i1); max-width:64ch; text-wrap:pretty; margin:0;}
.lc .meta{font-size:11.5px; color:var(--i2); letter-spacing:0;}

/* ---------------------------------------------------- règle 4 · orientation
   La seule chose de la page écrite comme on parle. Elle dit ce qui se passe
   et ce qu'il faut en faire — pas un titre, une phrase. */
.lc .orient{display:flex; align-items:flex-start; gap:var(--p4); padding:var(--p5) var(--p5);
  background:var(--surf); border-radius:var(--r-surface); box-shadow:0 0 0 1px var(--line);}
.lc .orient .badge{width:38px; height:38px; flex:none; border-radius:var(--r-control);
  display:flex; align-items:center; justify-content:center; background:var(--acc); color:var(--on-acc);}
.lc .orient .badge .ic{font-size:19px;}
.lc .orient.calm .badge{background:var(--surf-2); color:var(--i1);}
.lc .orient .txt{display:flex; flex-direction:column; gap:5px; min-width:0;}
.lc .orient .head{max-width:60ch; font-size:17px; font-weight:600; letter-spacing:-.015em; line-height:1.35; text-wrap:balance;}
.lc .orient .head b{color:var(--acc); font-weight:600;}
.lc .orient.calm .head b{color:var(--i0);}
.lc .orient .sub{max-width:82ch; font-size:13px; color:var(--i1); line-height:1.55; text-wrap:pretty;}
.lc .orient .sub .num{font-size:13px;}

/* ---------------------------------------------- règle 2 · famille de formes */
.lc button,.lc .btn{font-family:var(--sans); font-size:12px; font-weight:500; color:var(--i0);
  display:inline-flex; align-items:center; gap:7px; white-space:nowrap; text-decoration:none;
  background:var(--surf-2); border:0; border-radius:var(--r-control); padding:8px 15px; cursor:pointer;
  touch-action:manipulation;
  transition-property:background-color,color,transform; transition-duration:150ms; transition-timing-function:ease-out;}
.lc button .ic,.lc .btn .ic{font-size:14px; color:var(--i2);}
.lc button:active,.lc .btn:active{transform:scale(.96);}
.lc button:focus-visible,.lc .btn:focus-visible{outline:2px solid var(--i0); outline-offset:2px;}
@media (pointer:coarse){ .lc button,.lc .btn{min-height:44px;} }
.lc .chip{font-size:11.5px; color:var(--i1); background:var(--surf-2); border-radius:var(--r-control);
  padding:5px 12px; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;}
.lc .chip .ic{font-size:13px; color:var(--i2);}
.lc .field input{border-radius:var(--r-field);}
/* variantes de forme, au panneau */
.shape-doux{--r-control:8px;}
.shape-angle{--r-surface:0px; --r-field:0px; --r-control:0px;}

/* ------------------------------------------------------------------ en-tête */
.lc .hdr{flex-direction:row; align-items:center; gap:var(--p4); flex-wrap:wrap;}
.lc .ident{display:flex; align-items:baseline; gap:var(--p2);}
.lc .cs{font-family:var(--mono); font-size:19px; font-weight:600; letter-spacing:-.02em;}
.lc .ident .meta b{font-family:var(--mono); color:var(--i1); font-weight:500;}
.lc .hdr .chips{display:flex; gap:var(--p1); flex-wrap:wrap;}
.lc .hdr .acts{display:flex; gap:var(--p1); margin-left:auto;}
.lc .hdr .time{display:flex; align-items:baseline; gap:var(--p2); padding-left:var(--p4); border-left:1px solid var(--line);}
.lc .hdr .time .num{font-size:20px; font-weight:500;}

/* -------------------------------------------------------------------- carte */
.lc .maphead{display:flex; align-items:center; gap:var(--p4); flex-wrap:wrap;}
.lc .legend{display:flex; gap:var(--p3); flex-wrap:wrap; margin-left:auto; font-size:11.5px; color:var(--i2);}
.lc .legend span{display:flex; align-items:center; gap:6px;}
.lc .legend i{width:8px; height:8px; border-radius:2px; flex:none;}
.lc .legend .ic{font-size:13px;}
#map{height:min(50vh,460px); min-height:280px; background:var(--map-void); border-radius:var(--r-field);}
.leaflet-tile-pane{filter:var(--map-filter);}
.leaflet-container{background:var(--map-void); font-family:var(--mono); outline:0;}
.leaflet-control-zoom a{background:var(--surf) !important; color:var(--i0) !important;
  border:1px solid var(--line) !important; border-radius:var(--r-field) !important;}
.leaflet-control-attribution{background:color-mix(in oklch, var(--bg) 78%, transparent) !important;
  color:var(--i2) !important; font-family:var(--sans) !important; font-size:10px !important;}
.leaflet-control-attribution a{color:var(--i1) !important;}
.leaflet-div-icon{background:transparent !important; border:0 !important;}
.m-sat,.m-sta{display:flex; align-items:center; gap:6px; white-space:nowrap; font-family:var(--mono);
  font-weight:600; font-size:11.5px; letter-spacing:-.02em; color:#fff;
  text-shadow:0 0 3px #000,0 0 3px #000,0 0 7px #000;}
.m-sat i{flex:none; width:9px; height:9px; border-radius:50%; background:var(--acc); box-shadow:0 0 0 1.5px rgba(0,0,0,.85);}
.m-sta i{flex:none; width:9px; height:9px; border:2px solid #fff; box-shadow:0 0 0 1.5px rgba(0,0,0,.85);}

/* ------------------------------------------------- règle 3 · télémétrie juste
   Six mesures de même rang. Une seule peut porter l'accent, et seulement
   quand elle dit « Audible » : c'est la seule qui change ce que tu fais. */
.lc .telem{display:grid; grid-template-columns:repeat(6,1fr); gap:var(--g);}
@media (max-width:1100px){ .lc .telem{grid-template-columns:repeat(3,1fr); gap:var(--p5) var(--g);} }
@media (max-width:600px){ .lc .telem{grid-template-columns:repeat(2,1fr);} }
.lc .cell .num{font-size:17px; font-weight:500; margin-top:5px; display:block; white-space:nowrap;}
.lc .cell .num small{font-family:var(--sans); font-size:11px; font-weight:400; color:var(--i2); margin-left:4px; letter-spacing:0;}
.lc .cell.actionable .num{color:var(--acc);}
.lc .cell.actionable .lab{color:var(--acc);}

/* ------------------------------------------------------------ passage en cours */
.lc .cols{display:grid; grid-template-columns:1.35fr 1fr; gap:var(--g2); align-items:stretch;}
@media (max-width:1000px){ .lc .cols{grid-template-columns:1fr;} }
.lc .cols > *{display:flex; flex-direction:column;}
.lc .tail{margin-top:auto;}
.lc .satline{display:flex; align-items:baseline; gap:var(--p3); flex-wrap:wrap;}
.lc .satname{font-size:21px; font-weight:600; letter-spacing:-.022em; text-wrap:balance;}
/* l'écart bizarre sous le rebours : line-height 1 + interlettrage négatif
   créaient un vide optique. Le libellé est collé, l'air est mis au-dessus. */
.lc .cdblock{display:flex; flex-direction:column; gap:2px;}
.lc .cd{font-family:var(--mono); font-size:clamp(46px,6vw,var(--cd,76px)); font-weight:500; line-height:1.02;
  letter-spacing:-.045em; font-variant-numeric:tabular-nums; display:block;}
.lc .cdl{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--i1);}
.lc .cdl .ic{font-size:14px;}
.lc .facts{display:grid; grid-template-columns:repeat(4,1fr); gap:var(--p4);}
@media (max-width:640px){ .lc .facts{grid-template-columns:repeat(2,1fr);} }
.lc .facts .num{font-size:15px; font-weight:500; margin-top:5px; display:block;}
.lc .links{display:grid; grid-template-columns:1fr 1fr; gap:var(--p4) var(--g);}
@media (max-width:640px){ .lc .links{grid-template-columns:1fr;} }
.lc .links .num{font-size:20px; font-weight:500; margin-top:6px; display:block;}
.lc .links .dop{font-family:var(--mono); font-size:11.5px; color:var(--i1); margin-top:4px; font-variant-numeric:tabular-nums;}
.lc .links .sub{font-size:11.5px; color:var(--i2); margin-top:7px;}
.lc .polarwrap{align-items:center; gap:var(--p4);}
.lc svg.polar{width:100%; max-width:280px; height:auto; margin:auto 0;}
.lc .polar .ring{fill:none; stroke:var(--line); stroke-width:1;}
.lc .polar .cone{fill:none; stroke:var(--warn); stroke-width:1; stroke-dasharray:3 4;}
.lc .polar .cross{stroke:var(--line); stroke-width:1;}
.lc .polar .trace{fill:none; stroke:var(--i1); stroke-width:2; stroke-linecap:round;}
.lc .polar text{font-family:var(--sans); font-size:9px; font-weight:600; fill:var(--i2); letter-spacing:.06em;}
.lc .conenote{display:flex; gap:var(--p2); width:100%; align-self:stretch;}
.lc .conenote .ic{font-size:15px; color:var(--warn); flex:none; margin-top:1px;}

.lc .modes{display:grid; grid-template-columns:repeat(4,1fr); gap:var(--g);}
@media (max-width:900px){ .lc .modes{grid-template-columns:repeat(2,1fr); gap:var(--p5) var(--g);} }
@media (max-width:520px){ .lc .modes{grid-template-columns:1fr;} }
.lc .mode{display:flex; flex-direction:column; gap:var(--p2);}
.lc .stt{display:inline-flex; align-items:center; gap:5px; font-size:10px; font-weight:600;
  letter-spacing:.1em; text-transform:uppercase;}
.lc .stt .ic{font-size:12px;}
.lc .stt.on{color:var(--good);} .lc .stt.off{color:var(--bad);}
.lc .stt.sched{color:var(--warn);} .lc .stt.idle{color:var(--i2);}
.lc .mode .name{font-size:13px; font-weight:600;}
.lc .mode .num{font-size:16px; font-weight:500;}
.lc .mode .prose{font-size:11.5px; line-height:1.6;}

.lc .plan{display:grid; grid-template-columns:repeat(5,1fr); gap:var(--g);}
@media (max-width:900px){ .lc .plan{grid-template-columns:repeat(2,1fr); gap:var(--p5) var(--g);} }
.lc .step .when{font-size:11px; color:var(--i2);}
.lc .step .rx{font-family:var(--mono); font-size:15px; font-weight:500; margin-top:6px;
  font-variant-numeric:tabular-nums; letter-spacing:-.02em;}
.lc .step .tx{font-family:var(--mono); font-size:12px; color:var(--i1); margin-top:3px; font-variant-numeric:tabular-nums;}
.lc .step[data-now] .when,.lc .step[data-now] .rx{color:var(--acc);}
.lc .planfoot{display:flex; align-items:center; gap:var(--p4); flex-wrap:wrap;}

.lc .tablewrap{overflow-x:auto;}
.lc table{width:100%; border-collapse:collapse;}
.lc thead th{text-align:left; font-size:10px; font-weight:600; letter-spacing:.12em; text-transform:uppercase;
  color:var(--i2); padding:0 var(--p3) var(--p3) 0; white-space:nowrap;}
.lc thead th:last-child{padding-right:0;}
.lc tbody td{padding:var(--p3) var(--p3) var(--p3) 0; border-top:1px solid var(--line);
  font-size:13px; color:var(--i1); vertical-align:baseline;}
.lc tbody td:last-child{padding-right:0;}
.lc tbody tr{cursor:pointer; touch-action:manipulation;}
.lc tbody tr:focus-visible{outline:2px solid var(--i0); outline-offset:-2px;}
.lc .satcell{font-weight:600; color:var(--i0);}
.lc tr[data-now] .satcell{color:var(--acc);}
.lc tr[data-now] td{border-top-color:var(--acc);}
.lc td.n{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--i0);
  white-space:nowrap; letter-spacing:-.02em;}
.lc th.n{text-align:right;}
.lc td .u{font-family:var(--mono); color:var(--i2); font-size:11px;}
.lc .q{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; white-space:nowrap;}
.lc .q::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor; flex:none;}
.lc .q.good{color:var(--good);} .lc .q.ok{color:var(--warn);} .lc .q.poor{color:var(--i2);}

.lc .form{display:flex; gap:var(--p3); flex-wrap:wrap; align-items:flex-end;}
.lc .field{display:flex; flex-direction:column; gap:6px;}
.lc .field input{font-family:var(--mono); font-size:16px; color:var(--i0); background:var(--bg);
  border:1px solid var(--line); padding:9px 12px; width:145px;}
.lc .field input::placeholder{color:var(--i2);}
.lc .field input:focus{outline:2px solid var(--i0); outline-offset:-1px; border-color:transparent;}

.lc .gear{display:grid; grid-template-columns:repeat(3,1fr); gap:var(--g);}
@media (max-width:760px){ .lc .gear{grid-template-columns:1fr; gap:var(--p5);} }
.lc .gearcard{display:flex; gap:var(--p3);}
.lc .gearicon{width:32px; height:32px; flex:none; display:flex; align-items:center; justify-content:center;
  border-radius:var(--r-control); background:var(--surf-2); color:var(--i2);}
.lc .gearicon .ic{font-size:17px;}
.lc .gearcard .t{font-size:12.5px; font-weight:600;}
.lc .gearcard .s{font-size:11.5px; color:var(--i2); margin-top:4px; line-height:1.6;}
.lc footer{text-align:center; font-size:11px; color:var(--i2); line-height:1.8;}

/* ------------------------------------------------- onglets (proposition 3) */
.lc .tabs{display:flex; gap:var(--p1); flex-wrap:wrap;}
.lc .tabs button[aria-selected="true"]{background:var(--i0); color:var(--bg);}
.lc .tabs button[aria-selected="true"] .ic{color:var(--bg);}
.lc [role="tabpanel"][hidden]{display:none;}

.ic{width:1em; height:1em; flex:none; vertical-align:-.14em;}
.ic path,.ic circle,.ic rect{fill:currentColor;}

/* -------------------------------------------------------------- palettes */
.p-neutral{
  --bg:oklch(14.5% 0 0); --surf:oklch(20.5% 0 0); --surf-2:oklch(26.9% 0 0); --line:oklch(26.9% 0 0);
  --i0:oklch(98.5% 0 0); --i1:oklch(87% 0 0); --i2:oklch(70.8% 0 0);
  --acc:oklch(76.9% .188 70.08); --on-acc:oklch(14.5% 0 0);
  --good:oklch(76.5% .177 163.223); --warn:oklch(82.8% .189 84.429); --bad:oklch(70.4% .191 22.216);
  --map-void:oklch(18% 0 0); --map-filter:saturate(0) contrast(1.15) brightness(.68) sepia(.4) hue-rotate(-12deg);
}
.p-zinc{
  --bg:oklch(14.1% .005 285.823); --surf:oklch(21% .006 285.885); --surf-2:oklch(27.4% .006 286.033);
  --line:oklch(27.4% .006 286.033);
  --i0:oklch(98.5% 0 0); --i1:oklch(87.1% .006 286.286); --i2:oklch(70.5% .015 286.067);
  --acc:oklch(78.9% .154 211.53); --on-acc:oklch(14.1% .005 285.823);
  --good:oklch(76.5% .177 163.223); --warn:oklch(82.8% .189 84.429); --bad:oklch(70.4% .191 22.216);
  --map-void:oklch(18% .006 286); --map-filter:saturate(0) contrast(1.16) brightness(.70);
}
.p-stone{
  --bg:oklch(14.7% .004 49.25); --surf:oklch(21.6% .006 56.043); --surf-2:oklch(26.8% .007 34.298);
  --line:oklch(26.8% .007 34.298);
  --i0:oklch(98.5% .001 106.423); --i1:oklch(86.9% .005 56.366); --i2:oklch(70.9% .01 56.259);
  --acc:oklch(70.2% .183 293.541); --on-acc:oklch(14.7% .004 49.25);
  --good:oklch(76.5% .177 163.223); --warn:oklch(82.8% .189 84.429); --bad:oklch(70.4% .191 22.216);
  --map-void:oklch(19% .006 50); --map-filter:saturate(0) contrast(1.18) brightness(.66) sepia(.3) hue-rotate(-18deg);
}
.p-slate{
  --bg:oklch(12.9% .042 264.695); --surf:oklch(20.8% .042 265.755); --surf-2:oklch(27.9% .041 260.031);
  --line:oklch(27.9% .041 260.031);
  --i0:oklch(98.4% .003 247.858); --i1:oklch(86.9% .022 252.894); --i2:oklch(70.4% .04 256.788);
  --acc:oklch(74.6% .16 232.661); --on-acc:oklch(12.9% .042 264.695);
  --good:oklch(76.5% .177 163.223); --warn:oklch(82.8% .189 84.429); --bad:oklch(70.4% .191 22.216);
  --map-void:oklch(17% .04 264); --map-filter:saturate(0) contrast(1.24) brightness(.62);
}

@media (hover:hover) and (pointer:fine){
  .lc button:hover,.lc .btn:hover{background:var(--line);}
  .lc .tabs button[aria-selected="true"]:hover{background:var(--i0);}
  .lc tbody tr:not([data-now]):hover td{background:var(--surf-2);}
  .lc .field input:hover{border-color:var(--i2);}
}

.panel{position:fixed; top:14px; right:14px; z-index:2147483646; width:258px;
  padding:11px 13px 13px; border-radius:12px;
  background:rgba(10,10,10,.88); -webkit-backdrop-filter:blur(12px) saturate(1.4); backdrop-filter:blur(12px) saturate(1.4);
  box-shadow:0 0 0 1px rgba(255,255,255,.08) inset, 0 8px 24px rgba(0,0,0,.24);
  font:12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:rgba(255,255,255,.82);}
.panel summary{cursor:pointer; list-style:none; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:rgba(255,255,255,.5); font-weight:600; display:flex; align-items:center; gap:7px; margin:0 0 10px;}
.panel summary::-webkit-details-marker{display:none;}
.panel summary::before{content:"▾"; font-size:9px;}
.panel:not([open]) summary{margin:0;} .panel:not([open]) summary::before{content:"▸";}
.panel:not([open]){width:auto; padding:9px 13px;}
.panel summary:focus-visible{outline:2px solid rgba(255,255,255,.5); outline-offset:3px; border-radius:4px;}
.panel label{display:block; margin-bottom:10px;}
.panel .row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px;}
.panel .row b{font-weight:500; font-size:11.5px;}
.panel .row span{font-family:ui-monospace,monospace; font-size:11px; color:rgba(255,255,255,.55); font-variant-numeric:tabular-nums;}
.panel input[type=range]{width:100%; margin:0; accent-color:#fff; height:18px;}
.panel select{width:100%; font:inherit; font-size:11.5px; padding:5px 7px; border-radius:7px;
  background:rgba(255,255,255,.09); color:#fff; border:1px solid rgba(255,255,255,.12);}
.panel hr{border:0; border-top:1px solid rgba(255,255,255,.1); margin:12px 0;}
.panel .out{margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,.1);
  font-family:ui-monospace,monospace; font-size:10px; line-height:1.65; color:rgba(255,255,255,.5);
  word-break:break-word; user-select:all;}
.panel .copy{width:100%; margin-top:8px; font:inherit; font-size:11px; padding:6px; border-radius:7px;
  background:rgba(255,255,255,.12); color:#fff; border:0; cursor:pointer;}
.panel .copy:hover{background:rgba(255,255,255,.2);}
.panel .copy:focus-visible{outline:2px solid rgba(255,255,255,.5); outline-offset:2px;}
@media (max-width:920px){ .panel{position:static; width:auto; margin:12px 18px 0;} }

<script src="../data/vendor/leaflet.js"></script>
<script>
var ic = function (n) { return '<svg class="ic" aria-hidden="true"><use href="#i-' + n + '"></use></svg>'; };
var ETAT = 'encours';

/* règle 3 — « actionable » n'est PAS un marqueur décoratif : il ne s'allume
   que sur la lecture qui change ce que fait l'opérateur. Ici, Visibilité, et
   seulement quand elle vaut Audible. */
function RO(){
  var audible = ETAT === 'encours';
  return [
    ['Ruler','Distance', audible ? '1 148' : '11 402','km',0],
    ['Gauge','Vitesse','27 400','km/h',0],
    ['ArrowUp','Altitude','782','km',0],
    ['Globe','Position sat', audible ? '48.9°N 6.1°E' : '12.4°S 71.8°O','',0],
    ['Compass','Azimut / élév.', audible ? '118° / 24.3°' : '243° / −38.1°','',0],
    ['Eye','Visibilité', audible ? 'Audible' : 'Sous l’horizon','', audible ? 1 : 0]
  ];
}
var FACTS = [['Élév. max','81°'],['Durée','12 min 04 s'],['Az AOS → LOS','214° → 038°'],['Qualité omni','Zénith']];
var PLAN = [
  ['M-01 · 21:02 → 21:04','435.2650','145.9550',0], ['M-02 · 21:04 → 21:06','435.2600','145.9575',1],
  ['M-03 · 21:06 → 21:09','435.2500','145.9600',0], ['M-04 · 21:09 → 21:11','435.2450','145.9625',0],
  ['M-05 · 21:11 → 21:14','435.2400','145.9650',0]
];
var ISS = [
  ['on','Check','En service','APRS / Digipeater','145.8250','Toujours actif quand le packet est en service. Path ARISS — idéal en omni.'],
  ['off','X','Hors service','Répéteur FM cross-band','437.8000','Actif par périodes. Vérifier ariss.org avant le passage.'],
  ['idle','Moon','Au repos','Voix simplex ARISS','145.8000','Contacts scolaires et équipage. Écoute seule la plupart du temps.'],
  ['sched','Calendar','Programmé','SSTV','145.8000','Événement du 12 au 14 — images à décoder avec le Digirig.']
];
var ROWS = [
  ['AO-91 (RadFxSat / Fox-1B)','Transpondeur linéaire inversé','21:04','20:04 UTC','81°','12 min','435.2500','Zénith','ok',1],
  ['SO-50 (SaudiSat 1C)','Répéteur FM V/U','22:41','21:41 UTC','43°','9 min','436.7950','Bonne','good',0],
  ['ISS (ZARYA)','APRS / Digipeater','23:58','22:58 UTC','7°','4 min','145.8250','Rasant','poor',0],
  ['RS-44 (DOSAAF-85)','Transpondeur linéaire inversé','01:12','00:12 UTC','52°','18 min','435.6250','Bonne','good',0],
  ['PO-101 (Diwata-2B)','Répéteur FM U/V','02:47','01:47 UTC','14°','6 min','145.9000','Basse','ok',0],
  ['IO-117 (GreenCube)','Digipeater numérique','04:03','03:03 UTC','78°','21 min','435.3100','Zénith','ok',0]
];
var GEAR = [
  ['SignalStream','Antenne','Omnidirectionnelle fixe · 9 m sol<br>Pas de rotor — aucune orientation à faire'],
  ['Radio','Transceiver','Yaesu FTM-500D<br>Doppler à la molette (pas de commande CAT)'],
  ['Sliders','Interface','Digirig Mobile<br>Audio + PTT — APRS, SSTV, télémétrie']
];
function polarPath(){
  var R=110, cx=126, cy=126, p=[];
  for (var i=0;i<=44;i++){ var t=i/44, el=Math.sin(t*Math.PI)*81, az=214+t*184;
    var r=(90-el)/90*R, a=(az-90)*Math.PI/180;
    p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1)); }
  return 'M'+p.join(' L');
}

/* ---------------------------------------------- règle 4 · phrase d'orientation
   Écrite comme on parle, pas comme un titre. Elle dit ce qui se passe et ce
   qu'il faut en faire — c'est la seule chose de la page qui répond à
   « de quoi on parle ? » sans qu'on ait à déchiffrer un chiffre. */
function orient(){
  if (ETAT === 'encours')
    return '<div class="orient">' +
      '<div class="badge">' + ic('Activity') + '</div><div class="txt">' +
      '<div class="head"><b>AO-91 passe au-dessus de toi en ce moment.</b></div>' +
      '<div class="sub">Il te reste <span class="num">4 min 12 s</span> pour faire un contact. ' +
      'Écoute sur <span class="num">435.2494</span> MHz, émets sur <span class="num">145.9600</span> — mémoire M-02. ' +
      'Il culmine à 81°, dans le cône de silence de ton antenne : attends-toi à un creux au plus haut.</div>' +
      '</div></div>';
  return '<div class="orient calm">' +
    '<div class="badge">' + ic('Moon') + '</div><div class="txt">' +
    '<div class="head"><b>Rien au-dessus de toi en ce moment.</b></div>' +
    '<div class="sub">Prochain passage exploitable : <b>SO-50</b> dans <span class="num">1 h 52</span>, à <span class="num">22:41</span>. ' +
    'Il montera à 43° — c’est une bonne élévation pour ton omni. Répéteur FM, tu peux le travailler au FTM-500D.</div>' +
    '</div></div>';
}

/* --------------------------------------------------------------- fragments */
function fHeader(){
  return '<header class="block hdr">' +
    '<div class="ident"><span class="cs">F4MAJ</span><span class="meta">Locator <b>JN37QS</b> · Illzach</span></div>' +
    '<div class="chips"><span class="chip">' + ic('SignalStream') + 'Omni fixe · 9 m</span>' +
    '<span class="chip">' + ic('Radio') + 'Yaesu FTM-500D</span>' +
    '<span class="chip">' + ic('Check') + '9 TLE · il y a 1 h</span></div>' +
    '<div class="acts"><button type="button">' + ic('Refresh') + 'Rafraîchir</button>' +
    '<button type="button">' + ic('Setting') + 'Réglages</button></div>' +
    '<div class="time"><span class="num">21:07:44</span><span class="meta">heure locale</span></div>' +
  '</header>';
}
function fMap(title){
  return '<section class="block framed">' +
    '<div class="maphead"><h2 style="border:0;padding:0">' + ic('Globe') + (title || 'Où il est') +
      '<span class="meta">AO-91 (RadFxSat / Fox-1B)</span></h2>' +
      '<div class="legend"><span><i style="background:var(--acc)"></i>Satellite</span>' +
      '<span>' + ic('Home') + 'Ma station</span><span>' + ic('Target') + 'Zone audible</span>' +
      '<span>' + ic('Moon') + 'Zone de nuit</span><span>' + ic('CloudSun') + 'Météo</span></div></div>' +
    '<div id="map"></div></section>';
}
function fTelem(){
  return '<section class="block"><div class="telem">' + RO().map(function (r) {
    return '<div class="cell' + (r[4] ? ' actionable' : '') + '"><div class="lab">' + ic(r[0]) + r[1] + '</div>' +
      '<span class="num">' + r[2] + (r[3] ? '<small>' + r[3] + '</small>' : '') + '</span></div>';
  }).join('') + '</div></section>';
}
function fPass(title){
  var cd = ETAT === 'encours' ? '00:04:12' : '01:52:37';
  var lb = ETAT === 'encours' ? 'Passage en cours · perte du signal dans' : 'Prochain passage dans';
  return '<section class="block"><h2>' + ic('Timer') + (title || 'Le passage suivi') + '</h2>' +
    '<div class="satline"><span class="satname">AO-91 (RadFxSat / Fox-1B)</span>' +
    '<span class="chip">Transpondeur linéaire inversé</span></div>' +
    '<div class="cdblock"><span class="cd">' + cd + '</span>' +
    '<div class="cdl">' + ic(ETAT === 'encours' ? 'Activity' : 'Clock') + lb + '</div></div>' +
    '<hr class="sep"><div class="facts">' + FACTS.map(function (f) {
      return '<div><div class="lab">' + f[0] + '</div><span class="num">' + f[1] + '</span></div>'; }).join('') + '</div>' +
    '<hr class="sep"><div class="links">' +
      '<div><div class="lab">' + ic('ArrowUp') + 'Uplink · toi → sat</div><span class="num">145.9600</span>' +
        '<div class="dop">Doppler +3.21 kHz</div><div class="sub">PL 67.0 Hz</div></div>' +
      '<div><div class="lab">' + ic('ArrowDown') + 'Downlink · sat → toi</div><span class="num">435.2494</span>' +
        '<div class="dop">Doppler −9.87 kHz</div><div class="sub">SSB/CW · descente USB</div></div>' +
    '</div>' +
    '<hr class="sep"><p class="prose tail">Orbite haute : passages longs, très bon en omni. Culmine dans le cône de silence de l’antenne verticale — creux de signal possible au passage au zénith.</p>' +
  '</section>';
}
function fPolar(title){
  return '<section class="block polarwrap"><h2 style="align-self:stretch">' + ic('Route') + (title || 'Sa trajectoire') +
    '<span class="meta">vue polaire</span></h2>' +
    '<svg class="polar" viewBox="0 0 252 252" role="img" aria-label="Trajectoire du passage en azimut et élévation">' +
      '<circle class="ring" cx="126" cy="126" r="110"/><circle class="ring" cx="126" cy="126" r="73"/>' +
      '<circle class="ring" cx="126" cy="126" r="37"/><circle class="cone" cx="126" cy="126" r="18"/>' +
      '<line class="cross" x1="16" y1="126" x2="236" y2="126"/><line class="cross" x1="126" y1="16" x2="126" y2="236"/>' +
      '<path class="trace" d="' + polarPath() + '"/>' +
      '<text x="126" y="11" text-anchor="middle">N</text><text x="245" y="130" text-anchor="middle">E</text>' +
      '<text x="126" y="248" text-anchor="middle">S</text><text x="7" y="130" text-anchor="middle">O</text>' +
      '<text x="119" y="114" text-anchor="end">30°</text><text x="119" y="78" text-anchor="end">60°</text>' +
    '</svg>' +
    '<div class="conenote tail">' + ic('TriangleWarning') +
    '<span class="prose" style="font-size:11.5px">Cercle pointillé = cône de silence de l’omni verticale. Au-delà de 75° d’élévation, creux de signal possible au zénith.</span></div>' +
  '</section>';
}
function fPlan(title){
  return '<section class="block"><h2>' + ic('Sliders') + (title || 'Comment régler le poste') +
    '<span class="meta">FTM-500D · pas de 5 kHz · 5 mémoires</span></h2>' +
    '<div class="plan">' + PLAN.map(function (s) {
      return '<div class="step"' + (s[3] ? ' data-now' : '') + '><div class="when">' + s[0] + '</div>' +
        '<div class="rx">RX ' + s[1] + '</div><div class="tx">TX ' + s[2] + '</div></div>'; }).join('') + '</div>' +
    '<hr class="sep"><div class="planfoot"><button type="button">' + ic('Download') + 'Exporter les mémoires (CSV)</button>' +
    '<span class="prose" style="font-size:11.5px">Le FTM-500D n’a pas de commande CAT : ces cinq mémoires se sélectionnent à la molette aux horaires indiqués.</span></div>' +
  '</section>';
}
function fTable(title){
  return '<section class="block framed"><h2>' + ic('List') + (title || 'Quand sont les prochains') +
    '<span class="meta">heure locale · clique une ligne pour la suivre</span></h2>' +
    '<div class="tablewrap"><table><thead><tr><th>Satellite</th><th>Mode</th><th>AOS</th>' +
    '<th class="n">Élév. max</th><th class="n">Durée</th><th class="n">Downlink</th><th>Qualité</th></tr></thead><tbody>' +
    ROWS.map(function (r) {
      return '<tr tabindex="0"' + (r[9] ? ' data-now aria-current="true"' : '') + '>' +
        '<td><span class="satcell">' + r[0] + '</span></td><td>' + r[1] + '</td>' +
        '<td>' + r[2] + ' <span class="u">' + r[3] + '</span></td>' +
        '<td class="n">' + r[4] + '</td><td class="n">' + r[5] + '</td><td class="n">' + r[6] + '</td>' +
        '<td><span class="q ' + r[8] + '">' + r[7] + '</span></td></tr>'; }).join('') +
    '</tbody></table></div></section>';
}
function fIss(title){
  return '<section class="block"><h2>' + ic('Satellite') + (title || 'La radio de l’ISS') +
    '<span class="meta">relevé ARISS il y a 22 min</span></h2>' +
    '<div class="modes">' + ISS.map(function (m) {
      return '<div class="mode"><span class="stt ' + m[0] + '">' + ic(m[1]) + m[2] + '</span>' +
        '<div class="name">' + m[3] + '</div><span class="num">' + m[4] + '</span>' +
        '<p class="prose">' + m[5] + '</p></div>'; }).join('') + '</div></section>';
}
function fLog(title){
  return '<section class="block"><h2>' + ic('Notebook') + (title || 'Mon journal') + '<span class="meta">export ADIF</span></h2>' +
    '<div class="form">' +
      '<label class="field"><span class="lab">Indicatif</span><input placeholder="F1ABC" autocomplete="off"></label>' +
      '<label class="field"><span class="lab">Locator</span><input placeholder="JN38" autocomplete="off"></label>' +
      '<label class="field"><span class="lab">RST envoyé</span><input value="59"></label>' +
      '<label class="field"><span class="lab">RST reçu</span><input value="59"></label>' +
      '<label class="field"><span class="lab">Note</span><input placeholder="via AO-91" autocomplete="off"></label>' +
      '<button type="button">' + ic('Save') + 'Enregistrer le QSO</button>' +
      '<a class="btn" href="#">' + ic('Download') + 'Télécharger l’ADIF</a>' +
    '</div></section>';
}
function fGear(title){
  return '<section class="block"><h2>' + ic('Sliders') + (title || 'Mon matériel') + '<span class="meta">en service</span></h2>' +
    '<div class="gear">' + GEAR.map(function (g) {
      return '<div class="gearcard"><div class="gearicon">' + ic(g[0]) + '</div>' +
        '<div><div class="t">' + g[1] + '</div><div class="s">' + g[2] + '</div></div></div>'; }).join('') + '</div></section>';
}
var FOOT = '<footer>JB-SATRACK · station F4MAJ · TLE CelesTrak · statut ISS ARISS · calcul SGP4 satellite.js<br>' +
  '© 2026 F4MAJ &amp; Claude IA (Anthropic) — création conjointe</footer>';
var act = function (t) { return '<div class="act">' + t + '</div>'; };
var shell = function (inner) { return '<div class="lc p-neutral"><div class="page">' + inner + '</div></div>'; };

/* ============================================================ 1 · RÉCIT
   Trois actes dans l'ordre où l'opérateur se pose les questions :
   ce qui se passe maintenant, ce qui vient ensuite, sa station. Les titres
   d'acte sont des repères de lecture, pas des sections de plus. */
function vRecit(){
  return shell(
    fHeader() + orient() +
    act('Maintenant') + '<div class="cols">' + fPass('Le passage suivi') + fPolar('Sa trajectoire') + '</div>' +
    fMap('Où il est') + fTelem() + fPlan('Comment régler le poste') +
    act('Ensuite') + fTable('Les prochains passages') +
    act('Ma station') + fIss('La radio de l’ISS') + fLog('Mon journal') + fGear('Mon matériel') + FOOT
  );
}

/* ========================================================= 2 · QUESTIONS
   Chaque section porte la question qu'elle répond, en français. Le plus
   pédagogique : quelqu'un qui découvre le produit sait quoi chercher où. */
function vQuestions(){
  return shell(
    fHeader() + orient() +
    fPass('Qu’est-ce qui passe au-dessus de moi ?') +
    '<div class="cols">' + fMap('Où est-il exactement ?') + fPolar('Par où va-t-il passer ?') + '</div>' +
    fTelem() +
    fPlan('Sur quoi je cale mon poste ?') +
    fTable('Quand est le prochain ?') +
    fIss('L’ISS est-elle en service ?') +
    fLog('Qu’est-ce que j’ai contacté ?') +
    fGear('Avec quoi j’écoute ?') + FOOT
  );
}

/* ============================================================ 3 · FOCUS
   Une seule zone visible : ce qui se passe maintenant. Tout le reste passe
   derrière des onglets. Le plus digeste, et c'est aussi son risque —
   ce qui est replié cesse d'exister pour la plupart des gens. */
function vFocus(){
  var tabs = [
    ['Calendar','Prochains passages', fTable('Les prochains passages')],
    ['Sliders','Réglage du poste', fPlan('Comment régler le poste')],
    ['Satellite','Radio de l’ISS', fIss('La radio de l’ISS')],
    ['Notebook','Journal', fLog('Mon journal')],
    ['Radio','Station', fGear('Mon matériel')]
  ];
  return shell(
    fHeader() + orient() +
    '<div class="cols">' + fPass('Le passage suivi') + fPolar('Sa trajectoire') + '</div>' +
    fMap('Où il est') + fTelem() +
    '<section class="block"><div class="tabs" role="tablist">' +
      tabs.map(function (t, i) {
        return '<button type="button" role="tab" id="tb' + i + '" aria-controls="tp' + i + '" aria-selected="' +
          (i === 0) + '">' + ic(t[0]) + t[1] + '</button>'; }).join('') +
    '</div>' +
    tabs.map(function (t, i) {
      return '<div role="tabpanel" id="tp' + i + '" aria-labelledby="tb' + i + '"' + (i ? ' hidden' : '') + '>' +
        t[2] + '</div>'; }).join('') +
    '</section>' + FOOT
  );
}

var variants = [vRecit, vQuestions, vFocus];

/* onglets — délégation, donc rien à recâbler à chaque remontage */
document.addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('[role="tab"]'); if (!b) return;
  var list = b.closest('[role="tablist"]');
  [...list.querySelectorAll('[role="tab"]')].forEach(function (t) {
    var on = t === b;
    t.setAttribute('aria-selected', on);
    document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
  });
});
document.addEventListener('keydown', function (e) {
  var b = document.activeElement;
  if (!b || b.getAttribute('role') !== 'tab') return;
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  var t = [...b.closest('[role="tablist"]').querySelectorAll('[role="tab"]')];
  var i = (t.indexOf(b) + (e.key === 'ArrowRight' ? 1 : -1) + t.length) % t.length;
  t[i].focus(); t[i].click(); e.preventDefault();
});

var _map = null;
function mountMap(){
  var el = document.getElementById('map');
  if (_map) { _map.remove(); _map = null; }
  if (!el || typeof L === 'undefined') return;
  var IM='https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
  var LB='https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}';
  var map = _map = L.map(el, { zoomSnap:0, zoomDelta:.5, wheelPxPerZoomLevel:70, wheelDebounceTime:20,
    maxBoundsViscosity:1 }).setView([47.77, 7.34], 3);
  var mz = Math.log2(el.clientWidth/256);
  map.setMinZoom(mz); map.setMaxBounds([[-85.05,-180],[85.05,180]]);
  if (map.getZoom() < mz) map.setZoom(mz);
  var T = { noWrap:true, bounds:[[-85.05,-180],[85.05,180]], maxZoom:17, updateWhenZooming:false, updateWhenIdle:false };
  L.tileLayer(IM, Object.assign({ maxNativeZoom:3, keepBuffer:12 }, T)).addTo(map);
  L.tileLayer(IM, Object.assign({ keepBuffer:6, attribution:'Esri, Maxar, Earthstar Geographics' }, T)).addTo(map);
  L.tileLayer(LB, Object.assign({ keepBuffer:6 }, T)).addTo(map);
  var css = getComputedStyle(document.querySelector('.lc'));
  var acc = css.getPropertyValue('--acc').trim(), ink = css.getPropertyValue('--i0').trim();
  L.polygon([[90,-180],[90,-40],[10,-30],[-40,-60],[-90,-90],[-90,-180]],
    { stroke:false, fillColor:'#000', fillOpacity:.45, interactive:false }).addTo(map);
  L.polyline([[20,-70],[35,-40],[44,-14],[48,6]], { color:ink, weight:1.5, opacity:.4, interactive:false }).addTo(map);
  L.polyline([[48,6],[52,26],[50,54],[38,84]], { color:ink, weight:2.5, opacity:.9, interactive:false }).addTo(map);
  L.circle([51.4,25.5], { radius:2600000, color:ink, weight:1.5, opacity:.6, fillColor:ink, fillOpacity:.06, interactive:false }).addTo(map);
  L.polyline([[47.77,7.34],[51.4,25.5]], { color:acc, weight:1.5, dashArray:'5,5', interactive:false }).addTo(map);
  L.marker([51.4,25.5], { icon:L.divIcon({ className:'', iconAnchor:[5,10], html:'<div class="m-sat"><i></i>AO-91</div>' }) }).addTo(map);
  L.marker([47.77,7.34], { icon:L.divIcon({ className:'', iconAnchor:[5,10], html:'<div class="m-sta"><i></i>F4MAJ</div>' }) }).addTo(map);
  window.addEventListener('resize', function(){
    if (!_map) return; _map.invalidateSize();
    var z = Math.log2(el.clientWidth/256); _map.setMinZoom(z);
    if (_map.getZoom() < z) _map.setZoom(z);
  });
}

var PAIRS = [
  ["'Geist', system-ui, sans-serif", "'Geist Mono', ui-monospace, monospace"],
  ["'Inter', system-ui, sans-serif", "'JetBrains Mono', ui-monospace, monospace"],
  ["'Inter', system-ui, sans-serif", "'IBM Plex Mono', ui-monospace, monospace"],
  ["'Instrument Sans', system-ui, sans-serif", "'Space Mono', ui-monospace, monospace"],
  ["'Archivo', system-ui, sans-serif", "'Martian Mono', ui-monospace, monospace"]
];
function applyPanel(){
  var root = document.querySelector('.lc'); if (!root) return;
  var t=+document.getElementById('typo').value, pal=document.getElementById('pal').value,
      sh=document.getElementById('shape').value, pad=+document.getElementById('pad').value,
      gap=+document.getElementById('gap').value, cd=+document.getElementById('cd').value;
  root.classList.remove('p-neutral','p-zinc','p-stone','p-slate','shape-doux','shape-angle');
  root.classList.add(pal); if (sh) root.classList.add(sh);
  root.style.setProperty('--sans', PAIRS[t][0]); root.style.setProperty('--mono', PAIRS[t][1]);
  root.style.setProperty('--pad', pad); root.style.setProperty('--gap', gap);
  root.style.setProperty('--cd', cd + 'px');
  document.getElementById('v-pad').textContent = pad.toFixed(2) + '×';
  document.getElementById('v-gap').textContent = gap.toFixed(2) + '×';
  document.getElementById('v-cd').textContent = cd + ' px';
  document.getElementById('out').textContent =
    'lecture: ' + ['recit','questions','focus'][current] + ' · état: ' + ETAT + ' · palette: ' + pal +
    ' · sans: ' + PAIRS[t][0].split(',')[0].replace(/'/g,'') + ' · mono: ' + PAIRS[t][1].split(',')[0].replace(/'/g,'') +
    ' · formes: ' + (sh || 'pilules') + ' · padding: ' + pad.toFixed(2) + '× · écart: ' + gap.toFixed(2) +
    '× · rebours: ' + cd + 'px';
}
['pal','typo','shape','pad','gap','cd'].forEach(function(id){
  document.getElementById(id).addEventListener('input', applyPanel);
  document.getElementById(id).addEventListener('change', applyPanel);
});
document.getElementById('etat').addEventListener('change', function(e){ ETAT = e.target.value; mount(current); });
document.getElementById('copy').addEventListener('click', function(e){
  navigator.clipboard.writeText(document.getElementById('out').textContent);
  e.target.textContent = 'Copié ✓';
  setTimeout(function(){ e.target.textContent = 'Copier la configuration'; }, 1500);
});
</script>
<script src="assets/picker.js"></script>
<script>
mount = function (i) { stage.innerHTML = ''; requestAnimationFrame(function () {
  stage.innerHTML = variants[i](); applyPanel(); mountMap(); }); };
mount(current);
</script>
