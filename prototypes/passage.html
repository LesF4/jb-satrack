<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype · Passage sélectionné — quatre socles, quatre méthodes de hiérarchie</title>
<link rel="stylesheet" href="assets/picker.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap">
<style>
/* =========================================================================
   PASSAGE SÉLECTIONNÉ — quatre socles complets éprouvés sur le composant le
   plus exigeant du produit. L'axe de divergence n'est pas la couleur : c'est
   PAR QUOI la hiérarchie est obtenue.

     1 · COULEUR      la teinte porte le « maintenant », les tailles restent
                      proches. zinc + amber-500, Inter / JetBrains Mono.
     2 · ÉCHELLE      un écart de taille énorme entre le compte à rebours et
                      tout le reste. neutral + sky-400, Geist / Geist Mono.
     3 · POIDS & CASSE graisses et capitales espacées, palette quasi
                      monochrome. stone, l'accent EST l'encre pure.
                      Archivo / Space Mono.
     4 · ESPACE       le vide et le groupement font la hiérarchie, aucun effet
                      typographique fort. slate + violet-400, accent rarissime.
                      Instrument Sans / IBM Plex Mono.

   Règles communes, non négociables :
     · le SANS porte les mots, le MONO porte les nombres ;
     · le trio d'états (bon / attention / hors service) n'est JAMAIS la
       couleur d'accent — une couleur de marque ne signifie pas un état ;
     · l'accent ne marque que ce qui se passe maintenant.

   CONTRASTE — mesuré, pas supposé (WCAG 2.1, encre sur le fond de carte 900) :
     ramp-400 : zinc 6.74 · neutral 6.91 · stone 6.76 · slate 6.79   ✓
     ramp-500 : zinc 3.67 · neutral 3.79 · stone 3.64 · slate 3.74   ✗ < 4.5
     ramp-600 : zinc 2.29 · neutral 2.30 · stone 2.29 · slate 2.36   ✗
   Le 500 — celui du socle actuel pour les micro-étiquettes — ne passe pas.
   Défaut ici : 400. Le panneau laisse descendre pour voir le prix exact.
   ========================================================================= */
*{box-sizing:border-box;}
html,body{margin:0; padding:0;}
body{background:#09090b; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; font-synthesis:none;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

.proto-lead{font:11px/1.5 ui-monospace,monospace; letter-spacing:.06em; color:#5d5d64; padding:12px 18px 0;}
@media (min-width:1081px){ .proto-lead{padding-right:300px;} }   /* le panneau occupe le coin */
#stage{min-height:100vh;}

/* ------------------------------------------------------------ échelle d'espace
   Une seule progression, pilotée par --sp au panneau. Rien n'est écrit en dur. */
.sc{
  --sp:1; --r:4px; --cd:44px;
  --s1:calc(4px*var(--sp));  --s2:calc(8px*var(--sp));  --s3:calc(12px*var(--sp));
  --s4:calc(16px*var(--sp)); --s5:calc(22px*var(--sp)); --s6:calc(32px*var(--sp));
  --r-in:max(0px, calc(var(--r) - 3px));
  background:var(--bg); color:var(--i0); font-family:var(--sans);
  min-height:100vh; padding:var(--s5) clamp(12px,3vw,32px) 104px;
}
.sc .page{max-width:660px; margin:0 auto; display:flex; flex-direction:column; gap:var(--s4);}
.sc .card{background:var(--surf); border-radius:var(--r); padding:var(--s5); box-shadow:0 0 0 1px var(--line);}

/* ------------------------------------------------------------- typographie
   Un seul principe : le sans dit les mots, le mono dit les nombres. */
.sc h2{
  margin:0 0 var(--s4); font-family:var(--sans); font-size:14px; font-weight:600;
  letter-spacing:-.01em; color:var(--i0); display:flex; align-items:center; gap:var(--s2);
  text-wrap:balance;
}
.sc h2 .ic{font-size:15px; color:var(--i2);}
.sc h2 .meta{margin-left:auto; font-family:var(--mono); font-size:11.5px; font-weight:400;
  color:var(--i2); letter-spacing:0; font-variant-numeric:tabular-nums;}
.sc .lab{font-family:var(--sans); font-size:10px; font-weight:600; letter-spacing:.12em;
  text-transform:uppercase; color:var(--i2); display:flex; align-items:center; gap:6px;}
.sc .lab .ic{font-size:12px;}
.sc .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em; color:var(--i0);}
.sc .val{font-family:var(--sans); color:var(--i0);}     /* un mot, jamais un nombre */
.sc .prose{font-family:var(--sans); font-size:13px; line-height:1.65; color:var(--i1);
  max-width:62ch; text-wrap:pretty; margin:0;}
.sc .meta{font-family:var(--sans); font-size:11.5px; color:var(--i2);}

/* ---------------------------------------------------------------- commandes */
.sc button{
  font-family:var(--sans); font-size:12px; font-weight:500; color:var(--i1);
  display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
  background:var(--surf); border:0; border-radius:var(--r-in); padding:8px 13px;
  box-shadow:0 0 0 1px var(--line); cursor:pointer; touch-action:manipulation;
  transition-property:background-color,color,box-shadow,transform;
  transition-duration:150ms; transition-timing-function:ease-out;
}
.sc button[data-active]{color:var(--i0); background:var(--surf-2); box-shadow:0 0 0 1px var(--line-2);}
.sc button:active{transform:scale(.96);}
.sc button:focus-visible{outline:2px solid var(--i0); outline-offset:2px;}
@media (pointer:coarse){ .sc button{min-height:44px;} }
@media (hover:hover) and (pointer:fine){
  .sc button:not([data-active]):hover{background:var(--surf-2); color:var(--i0);}
}
.sc .etats{display:flex; flex-wrap:wrap; gap:var(--s1);}
.sc .chip{
  font-family:var(--sans); font-size:11.5px; color:var(--i1); background:var(--surf-2);
  border-radius:999px; padding:5px 11px; display:inline-flex; align-items:center; gap:6px;
}

/* ------------------------------------------------------------- le composant
   Le compte à rebours est plafonné à 14.5vw : la proposition « échelle » demande
   92 px, qui ne tiennent pas dans 390 px de large. Le plafond ne se déclenche
   qu'en dessous de ~640 px — au-dessus, la valeur du panneau est exacte. */
.sc .satline{display:flex; align-items:baseline; gap:var(--s3); flex-wrap:wrap; margin-bottom:var(--s4);}
.sc .satname{font-family:var(--sans); font-size:20px; font-weight:600; letter-spacing:-.022em; text-wrap:balance;}

.sc .cdblock{display:block;}
.sc .cd{font-family:var(--mono); font-size:min(var(--cd), 14.5vw); font-weight:500; line-height:1;
  letter-spacing:-.045em; font-variant-numeric:tabular-nums; display:block; color:var(--i0);}
.sc .cdl{display:flex; align-items:center; gap:7px; margin-top:var(--s2);
  font-family:var(--sans); font-size:12.5px; color:var(--i1);}
.sc .cdl .ic{font-size:14px;}
.sc .live{display:none; width:6px; height:6px; border-radius:50%; background:var(--acc); flex:none;}
.sc .cdsub{font-family:var(--mono); font-size:11px; color:var(--i2); margin-top:var(--s1);
  font-variant-numeric:tabular-nums;}

/* indisponibilité — le seul état où le composant n'a rien à compter */
.sc .unavail{display:flex; gap:var(--s3); align-items:flex-start;
  background:var(--bg); border-radius:var(--r-in); padding:var(--s4);}
.sc .unavail .ic{font-size:18px; color:var(--i2); flex:none; margin-top:1px;}
.sc .unavail b{font-family:var(--sans); font-size:13px; font-weight:600; display:block; margin-bottom:6px;}
.sc .unavail .prose{font-size:12.5px;}

.sc .facts{display:grid; grid-template-columns:repeat(4,1fr); gap:var(--s2); margin-top:var(--s5);}
@media (max-width:560px){ .sc .facts{grid-template-columns:repeat(2,1fr);} }
.sc .fact{background:var(--bg); border-radius:var(--r-in); padding:var(--s3) var(--s4);}
.sc .fact .num,.sc .fact .val{font-size:15px; font-weight:500; margin-top:5px; display:block; white-space:nowrap;}
.sc .fact .val.q{display:flex; align-items:center;}
.sc .hint{display:flex; gap:var(--s2); align-items:flex-start; margin-top:var(--s3);}
.sc .hint .ic{font-size:14px; color:var(--i2); flex:none; margin-top:2px;}
.sc .hint .prose{font-size:11.5px; line-height:1.55;}

.sc .links{display:grid; grid-template-columns:1fr 1fr; gap:var(--s2); margin-top:var(--s2);}
@media (max-width:480px){ .sc .links{grid-template-columns:1fr;} }
.sc .link{background:var(--bg); border-radius:var(--r-in); padding:var(--s3) var(--s4);}
.sc .link .num{font-size:20px; font-weight:500; margin-top:7px; display:block;}
.sc .link .num small{font-family:var(--sans); font-size:11px; font-weight:400; color:var(--i2);
  margin-left:5px; letter-spacing:0;}
.sc .link .val{font-size:15px; font-weight:500; margin-top:9px; display:block; color:var(--i1);}
.sc .dop{font-family:var(--mono); font-size:11.5px; color:var(--i1); margin-top:5px;
  font-variant-numeric:tabular-nums;}
.sc .sub{font-family:var(--sans); font-size:11.5px; color:var(--i2); margin-top:8px; line-height:1.5;}

.sc .note{margin-top:var(--s5); padding-top:var(--s4); border-top:1px solid var(--line);
  display:flex; gap:var(--s3); align-items:flex-start;}
.sc .note .ic{font-size:15px; color:var(--i2); flex:none; margin-top:2px;}

/* trio d'états — jamais la couleur d'accent */
.sc .q{display:inline-flex; align-items:center; gap:6px;}
.sc .q::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor; flex:none;}
.sc .q.good{color:var(--good);} .sc .q.ok{color:var(--warn);} .sc .q.poor{color:var(--bad);}

.ic{width:1em; height:1em; flex:none; vertical-align:-.14em;}
.ic path,.ic circle,.ic rect{fill:currentColor;}

/* =======================================================================
   1 · HIÉRARCHIE PAR LA COULEUR
   Les tailles restent groupées (compte à rebours 40 px contre 20 px pour les
   fréquences, 15 px pour les faits) : c'est l'ambre qui dit « maintenant ».
   Corollaire assumé : hors passage en cours, la carte n'a plus d'accent — et
   c'est exactement ce que le sélecteur d'état sert à voir.
   ======================================================================= */
.h-couleur .cdblock[data-now]{box-shadow:inset 3px 0 0 var(--acc); padding-left:var(--s3); margin-left:calc(-1*var(--s3));}
.h-couleur .cdblock[data-now] .cd{color:var(--acc);}
.h-couleur .cdblock[data-now] .cdl{color:var(--acc);}
.h-couleur .link[data-now]{box-shadow:inset 2px 0 0 var(--acc);}
.h-couleur .link[data-now] .num{color:var(--acc);}

/* =======================================================================
   2 · HIÉRARCHIE PAR L'ÉCHELLE
   92 px contre 13 px : un rapport de 7. Le compte à rebours est le seul objet
   de la carte ; tout le reste est de la documentation. La couleur ne sert plus
   qu'à une pastille de 6 px, et on peut la retirer sans rien perdre.
   ======================================================================= */
.h-echelle h2{font-weight:400; color:var(--i2); font-size:12.5px;}
.h-echelle h2 .meta{color:var(--i2);}
.h-echelle .satname{font-size:16px; font-weight:600; letter-spacing:-.012em;}
.h-echelle .chip{font-size:11px; padding:4px 9px;}
.h-echelle .satline{margin-bottom:var(--s3);}
.h-echelle .cd{font-weight:500; letter-spacing:-.055em;}
.h-echelle .cdl{font-size:12px; margin-top:var(--s2);}
.h-echelle .lab{font-size:9.5px; letter-spacing:.14em;}
.h-echelle .fact .num,.h-echelle .fact .val{font-size:13px; font-weight:400; margin-top:4px;}
.h-echelle .link .num{font-size:15px; font-weight:400; margin-top:6px;}
.h-echelle .link .val{font-size:13px; font-weight:400;}
.h-echelle .dop{font-size:11px;}
.h-echelle .prose{font-size:12px;}
.h-echelle .cdblock[data-now] .live{display:inline-block;}

/* =======================================================================
   3 · HIÉRARCHIE PAR LE POIDS ET LA CASSE
   Palette quasi monochrome : l'accent EST l'encre pure (stone-50). « Maintenant »
   se dit en 700 et en blanc plein ; « à venir » descend en 400 et en gris. Les
   trois couleurs d'état sont les seules teintes de la carte, et elles ne servent
   que des pastilles de 6 px.
   ======================================================================= */
.h-poids h2{text-transform:uppercase; letter-spacing:.14em; font-size:11px; font-weight:700;}
.h-poids .satname{font-size:15px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;}
.h-poids .chip{text-transform:uppercase; font-size:10px; font-weight:600; letter-spacing:.09em; padding:5px 10px;}
.h-poids .lab{font-weight:700; letter-spacing:.18em;}
.h-poids .cd{font-weight:400; letter-spacing:-.03em; color:var(--i1);}
.h-poids .cdl{text-transform:uppercase; font-size:10.5px; font-weight:500; letter-spacing:.14em; color:var(--i2);}
.h-poids .cdsub{color:var(--i2);}
.h-poids .cdblock[data-now] .cd{color:var(--acc); font-weight:700;}
.h-poids .cdblock[data-now] .cdl{color:var(--acc); font-weight:700;}
.h-poids .fact .num,.h-poids .fact .val{font-size:16px; font-weight:700;}
.h-poids .link .num{font-size:18px; font-weight:700;}
.h-poids .link .val{font-size:14px; font-weight:400; text-transform:uppercase; letter-spacing:.1em;}
.h-poids .dop{font-weight:400; color:var(--i2);}
.h-poids .link[data-now] .num{color:var(--acc);}
.h-poids .link[data-now] .lab{color:var(--acc);}
.h-poids .link[data-now] .dop{color:var(--i1);}
.h-poids .unavail b{text-transform:uppercase; letter-spacing:.12em; font-size:11px; font-weight:700;}

/* =======================================================================
   4 · HIÉRARCHIE PAR L'ESPACE
   Aucune capitale, aucune graisse au-dessus de 500, une seule taille forte.
   Ce sont les intervalles qui groupent : les faits n'ont plus de boîte, ils
   sont tenus par le vide. « Maintenant » se dit en s'octroyant de la place —
   le bloc du compte à rebours devient une surface. L'accent, lui, ne dépasse
   jamais 7 px de diamètre.
   ======================================================================= */
.h-espace .card{padding:var(--s6);}
.h-espace h2{font-weight:500; font-size:13px; margin-bottom:var(--s5);}
.h-espace .satname{font-size:18px; font-weight:500; letter-spacing:-.012em;}
.h-espace .satline{margin-bottom:var(--s5);}
.h-espace .chip{background:transparent; box-shadow:0 0 0 1px var(--line); color:var(--i2); padding:4px 10px;}
.h-espace .lab{text-transform:none; letter-spacing:0; font-size:11.5px; font-weight:400;}
.h-espace .cd{font-weight:400; letter-spacing:-.03em;}
.h-espace .cdl{font-size:13px; margin-top:var(--s3);}
.h-espace .cdsub{margin-top:var(--s2);}
.h-espace .cdblock[data-now]{background:var(--surf-2); border-radius:var(--r);
  padding:var(--s4) var(--s5); margin:0 calc(-1*var(--s4));}
.h-espace .cdblock[data-now] .live{display:inline-block; width:7px; height:7px;}
.h-espace .facts{gap:var(--s5); margin-top:var(--s6); grid-template-columns:repeat(2,1fr);}
.h-espace .fact{background:transparent; padding:0;}
.h-espace .fact .num,.h-espace .fact .val{font-size:16px; font-weight:400; margin-top:var(--s2);}
.h-espace .links{gap:var(--s5); margin-top:var(--s6);}
.h-espace .link{background:transparent; padding:0;}
.h-espace .link .num{font-size:19px; font-weight:400; margin-top:var(--s2);}
.h-espace .link .val{font-size:15px; font-weight:400; margin-top:var(--s2);}
.h-espace .sub{margin-top:var(--s3);}
.h-espace .note{margin-top:var(--s6); padding-top:var(--s5);}
.h-espace .unavail{background:transparent; padding:0;}
.h-espace .hint{margin-top:var(--s4);}

/* ===================================================== 1 · ZINC · AMBRE 500
   Gris à peine froids + l'ambre historique du produit, réduit à une touche.
   L'ambre étant la marque, l'état « attention » ne peut plus être ambre : il
   passe en valeur (pastille zinc-300 + le mot). C'est le prix de l'hypothèse. */
.p-zinc{
  --bg:oklch(14.1% .005 285.823);        /* zinc-950 */
  --surf:oklch(21% .006 285.885);        /* zinc-900 */
  --surf-2:oklch(27.4% .006 286.033);    /* zinc-800 */
  --line:oklch(27.4% .006 286.033);      /* zinc-800 */
  --line-2:oklch(37% .013 285.805);      /* zinc-700 */
  --i0:oklch(98.5% 0 0);                 /* zinc-50  · 16.98:1 sur zinc-900 */
  --i1:oklch(87.1% .006 286.286);        /* zinc-300 · 11.99:1 */
  --acc:oklch(76.9% .188 70.08);         /* amber-500 · 8.26:1 */
  --good:oklch(76.5% .177 163.223);      /* emerald-400 · 9.17:1 */
  --warn:oklch(87.1% .006 286.286);      /* zinc-300 — pas de couleur de marque sur un état */
  --bad:oklch(70.4% .191 22.216);        /* red-400 · 6.13:1 */
}
/* ===================================================== 2 · NEUTRAL · SKY 400
   Gris parfaitement neutres. L'accent est là par principe, pas par nécessité :
   dans cette proposition on peut le supprimer sans rien casser. */
.p-neutral{
  --bg:oklch(14.5% 0 0);                 /* neutral-950 */
  --surf:oklch(20.5% 0 0);               /* neutral-900 */
  --surf-2:oklch(26.9% 0 0);             /* neutral-800 */
  --line:oklch(26.9% 0 0);               /* neutral-800 */
  --line-2:oklch(37.1% 0 0);             /* neutral-700 */
  --i0:oklch(98.5% 0 0);                 /* neutral-50  · 17.16:1 sur neutral-900 */
  --i1:oklch(87% 0 0);                   /* neutral-300 · 12.09:1 */
  --acc:oklch(74.6% .16 232.661);        /* sky-400 · 8.21:1 */
  --good:oklch(76.5% .177 163.223);      /* emerald-400 · 9.27:1 */
  --warn:oklch(82.8% .189 84.429);       /* amber-400 · 10.43:1 */
  --bad:oklch(70.4% .191 22.216);        /* red-400 · 6.19:1 */
}
/* ===================================================== 3 · STONE · ENCRE PURE
   Gris chauds. Aucune couleur d'accent : « maintenant » se dit en blanc plein
   et en 700. Les trois états restent les seules teintes de la carte. */
.p-stone{
  --bg:oklch(14.7% .004 49.25);          /* stone-950 */
  --surf:oklch(21.6% .006 56.043);       /* stone-900 */
  --surf-2:oklch(26.8% .007 34.298);     /* stone-800 */
  --line:oklch(26.8% .007 34.298);       /* stone-800 */
  --line-2:oklch(37.4% .01 67.558);      /* stone-700 */
  --i0:oklch(98.5% .001 106.423);        /* stone-50  · 16.76:1 sur stone-900 */
  --i1:oklch(86.9% .005 56.366);         /* stone-300 · 11.75:1 */
  --acc:oklch(98.5% .001 106.423);       /* stone-50 — l'accent EST l'encre */
  --good:oklch(76.5% .177 163.223);      /* emerald-400 · 9.05:1 */
  --warn:oklch(82.8% .189 84.429);       /* amber-400 · 10.19:1 */
  --bad:oklch(70.4% .191 22.216);        /* red-400 · 6.05:1 */
}
/* ===================================================== 4 · SLATE · VIOLET 400
   Gris froids, légèrement bleus — la famille de l'imagerie satellite. L'accent
   n'apparaît qu'une fois par carte, et seulement pendant le passage. */
.p-slate{
  --bg:oklch(12.9% .042 264.695);        /* slate-950 */
  --surf:oklch(20.8% .042 265.755);      /* slate-900 */
  --surf-2:oklch(27.9% .041 260.031);    /* slate-800 */
  --line:oklch(27.9% .041 260.031);      /* slate-800 */
  --line-2:oklch(37.2% .044 257.287);    /* slate-700 */
  --i0:oklch(98.4% .003 247.858);        /* slate-50  · 17.05:1 sur slate-900 */
  --i1:oklch(86.9% .022 252.894);        /* slate-300 · 12.02:1 */
  --acc:oklch(70.2% .183 293.541);       /* violet-400 · 6.26:1 */
  --good:oklch(76.5% .177 163.223);      /* emerald-400 · 9.23:1 */
  --warn:oklch(82.8% .189 84.429);       /* amber-400 · 10.39:1 */
  --bad:oklch(70.4% .191 22.216);        /* red-400 · 6.17:1 */
}

/* ============================================================ panneau (chrome)
   Non thématisé : c'est de l'outillage, pas la proposition. */
.panel{position:fixed; top:14px; right:14px; z-index:2147483646; width:262px;
  padding:11px 13px 13px; border-radius:12px;
  background:rgba(10,10,10,.87); -webkit-backdrop-filter:blur(12px) saturate(1.4); backdrop-filter:blur(12px) saturate(1.4);
  box-shadow:0 0 0 1px rgba(255,255,255,.08) inset, 0 8px 24px rgba(0,0,0,.24);
  font:12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:rgba(255,255,255,.82);}
.panel summary{cursor:pointer; list-style:none; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:rgba(255,255,255,.5); font-weight:600; display:flex; align-items:center; gap:7px; margin:0 0 10px;}
.panel summary::-webkit-details-marker{display:none;}
.panel summary::before{content:"▾"; font-size:9px;}
.panel:not([open]) summary{margin:0;}
.panel:not([open]) summary::before{content:"▸";}
.panel:not([open]){width:auto; padding:9px 13px;}
.panel summary:focus-visible{outline:2px solid rgba(255,255,255,.5); outline-offset:3px; border-radius:4px;}
.panel label{display:block; margin-bottom:10px;}
.panel .row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; gap:8px;}
.panel .row b{font-weight:500; font-size:11.5px;}
.panel .row span{font-family:ui-monospace,monospace; font-size:11px; color:rgba(255,255,255,.55);
  font-variant-numeric:tabular-nums; white-space:nowrap;}
.panel .row span.ko{color:#ff8a8a;}
.panel input[type=range]{width:100%; margin:0; accent-color:#fff; height:18px;}
.panel select{width:100%; font:inherit; font-size:11.5px; padding:5px 7px; border-radius:7px;
  background:rgba(255,255,255,.09); color:#fff; border:1px solid rgba(255,255,255,.12);}
.panel .out{margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,.1);
  font-family:ui-monospace,monospace; font-size:10px; line-height:1.65; color:rgba(255,255,255,.5);
  word-break:break-word; user-select:all;}
.panel .copy{width:100%; margin-top:8px; font:inherit; font-size:11px; padding:6px; border-radius:7px;
  background:rgba(255,255,255,.12); color:#fff; border:0; cursor:pointer;}
.panel .copy:hover{background:rgba(255,255,255,.2);}
.panel .copy:focus-visible{outline:2px solid rgba(255,255,255,.5); outline-offset:2px;}
@media (max-width:1080px){ .panel{position:static; width:auto; margin:12px 18px 0;} }
</style>

      <option value="600">600 — limite basse</option>
    </select></label>
  <div class="out" id="out">—</div>
  <button class="copy" id="copy" type="button">Copier la configuration</button>
</details>

<nav class="proto-picker" aria-label="Méthode de hiérarchie">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">1 · Couleur</button>
  <button class="proto-picker-item">2 · Échelle</button>
  <button class="proto-picker-item">3 · Poids</button>
  <button class="proto-picker-item">4 · Espace</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-replay proto-picker-item" aria-label="Rejouer (R)">↻</button>
</nav>

<script>
var ic = function (n) { return '<svg class="ic" aria-hidden="true"><use href="#i-' + n + '"></use></svg>'; };

/* ---------------------------------------------------------------- les états
   Chaînes exactes du catalogue (data/satellites.json) et formats exacts de
   web/app.js : mhz() = toFixed(4), durée = « m min ss s », Doppler en fr-FR
   (virgule décimale) avec un vrai signe moins « − ». */
var ETATS = [
  ['avenir',  'À venir'],
  ['encours', 'En cours'],
  ['ecoute',  'Écoute seule'],
  ['santle',  'Sans TLE'],
  ['rasant',  'Rasant']
];

var D = {
  avenir: {
    nom:'AO-91 (RadFxSat / Fox-1B)', mode:'Transpondeur linéaire inversé',
    now:false, cd:'01:52:37', icone:'Clock', cdl:'prochain passage dans',
    cdsub:'AOS 21:04:12 · heure locale',
    facts:[['Élév. max','81°','num'],['Durée','12 min 04 s','num'],
           ['Az AOS → LOS','214° → 038°','num'],['Qualité omni','Zénith','val q ok']],
    hint:'Culmine dans le cône de silence de l’antenne verticale : creux possible au TCA.',
    dl:{f:'435.2500', dop:'+9,4 kHz au lever', sub:'SSB/CW (montée LSB, descente USB)'},
    ul:{f:'145.9600', dop:'−3,2 kHz au lever', sub:'PL 67.0 Hz'},
    note:'Orbite haute : passages longs (jusqu’à 20 min), très bon en omni. Nécessite SSB — pas faisable avec le FTM-500D.'
  },
  encours: {
    nom:'AO-91 (RadFxSat / Fox-1B)', mode:'Transpondeur linéaire inversé',
    now:true, cd:'00:04:12', icone:'Activity', cdl:'perte du signal dans',
    cdsub:'LOS 21:11:56 · heure locale',
    facts:[['Élév. max','81°','num'],['Durée','12 min 04 s','num'],
           ['Az AOS → LOS','214° → 038°','num'],['Qualité omni','Zénith','val q ok']],
    hint:'Culmine dans le cône de silence de l’antenne verticale : creux possible au TCA.',
    dl:{f:'435.2450', dop:'−7,8 kHz Doppler', sub:'SSB/CW (montée LSB, descente USB)'},
    ul:{f:'145.9625', dop:'+2,6 kHz Doppler', sub:'PL 67.0 Hz'},
    note:'Orbite haute : passages longs (jusqu’à 20 min), très bon en omni. Nécessite SSB — pas faisable avec le FTM-500D.'
  },
  ecoute: {
    nom:'ISS (ZARYA)', mode:'SSTV',
    now:true, cd:'00:02:55', icone:'Activity', cdl:'perte du signal dans',
    cdsub:'LOS 22:41:09 · heure locale',
    facts:[['Élév. max','34°','num'],['Durée','9 min 41 s','num'],
           ['Az AOS → LOS','291° → 145°','num'],['Qualité omni','Bonne','val q good']],
    hint:'',
    dl:{f:'145.8000', dop:'−1,4 kHz Doppler', sub:'FM / PD120'},
    ul:null,
    note:'Événements ponctuels, images à décoder avec le Digirig.'
  },
  santle: {
    nom:'AO-7 (OSCAR 7)', mode:'Mode B linéaire',
    now:false, cd:null, icone:'TriangleWarning',
    unavail:['Prédiction indisponible','Aucun TLE pour AO-7 (OSCAR 7) dans le groupe « amateur » de CelesTrak. Ni position, ni lever, ni Doppler : le satellite reste au catalogue, mais rien ne peut être calculé tant que l’élément orbital manque.'],
    facts:[['Élév. max','—','num'],['Durée','—','num'],
           ['Az AOS → LOS','—','num'],['Qualité omni','—','val']],
    hint:'',
    dl:{f:'145.9500', dop:'Doppler non calculable', sub:'SSB/CW'},
    ul:{f:'432.1500', dop:'Doppler non calculable', sub:'SSB/CW'},
    note:'Lancé en 1974, alterne mode A/B selon l’éclairement. SSB requis.'
  },
  rasant: {
    nom:'ISS (ZARYA)', mode:'APRS / Digipeater',
    now:false, cd:'02:58:44', icone:'Clock', cdl:'prochain passage dans',
    cdsub:'AOS 23:58:02 · heure locale',
    facts:[['Élév. max','7°','num'],['Durée','4 min 12 s','num'],
           ['Az AOS → LOS','168° → 231°','num'],['Qualité omni','Rasant','val q poor']],
    hint:'Trop bas : obstacles et trajet atmosphérique long.',
    dl:{f:'145.8250', dop:'+4,1 kHz au lever', sub:'FM 1200 bd AFSK'},
    ul:{f:'145.8250', dop:'−4,1 kHz au lever', sub:'FM 1200 bd AFSK'},
    note:'Toujours actif quand le packet est en service. Path ARISS. Idéal antenne omni.'
  }
};

var etat = 'encours';

function factHtml(f) {
  return '<div class="fact"><div class="lab">' + f[0] + '</div>' +
    '<span class="' + f[2] + '">' + f[1] + '</span></div>';
}

function linkHtml(side, o, now) {
  var lab = side === 'dl'
    ? ic('ArrowDown') + 'Downlink (sat → toi)'
    : ic('ArrowUp') + 'Uplink (toi → sat)';
  if (!o) {                     /* mode dont `up` vaut null — SSTV de l'ISS */
    return '<div class="link"><div class="lab">' + lab + '</div>' +
      '<span class="val">écoute seule</span>' +
      '<div class="sub">Ce mode ne s’émet pas : il n’y a rien à régler en émission, ' +
      'et la mémoire exportée reste vide côté TX.</div></div>';
  }
  return '<div class="link"' + (now ? ' data-now' : '') + '>' +
    '<div class="lab">' + lab + '</div>' +
    '<span class="num">' + o.f + '<small>MHz</small></span>' +
    '<div class="dop">' + o.dop + '</div>' +
    '<div class="sub">' + o.sub + '</div></div>';
}

function composant() {
  var d = D[etat];
  var tete = d.cd === null
    ? '<div class="unavail">' + ic('TriangleWarning') +
      '<div><b>' + d.unavail[0] + '</b><p class="prose">' + d.unavail[1] + '</p></div></div>'
    : '<div class="cdblock"' + (d.now ? ' data-now' : '') + '>' +
      '<span class="cd">' + d.cd + '</span>' +
      '<div class="cdl"><span class="live" aria-hidden="true"></span>' + ic(d.icone) + d.cdl + '</div>' +
      '<div class="cdsub">' + d.cdsub + '</div></div>';

  return '<section class="card">' +
    '<h2>' + ic('Timer') + 'Passage sélectionné<span class="meta">21:07:44</span></h2>' +
    '<div class="satline"><span class="satname">' + d.nom + '</span>' +
      '<span class="chip">' + d.mode + '</span></div>' +
    tete +
    '<div class="facts">' + d.facts.map(factHtml).join('') + '</div>' +
    (d.hint ? '<div class="hint">' + ic('TriangleWarning') +
      '<p class="prose">' + d.hint + '</p></div>' : '') +
    '<div class="links">' + linkHtml('ul', d.ul, d.now) + linkHtml('dl', d.dl, d.now) + '</div>' +
    '<div class="note">' + ic('Notebook') + '<p class="prose">' + d.note + '</p></div>' +
  '</section>';
}

var PAL   = ['p-zinc','p-neutral','p-stone','p-slate'];
var HIER  = ['h-couleur','h-echelle','h-poids','h-espace'];

function carte(i) {
  var boutons = ETATS.map(function (e) {
    return '<button type="button" class="etat" data-etat="' + e[0] + '"' +
      (e[0] === etat ? ' data-active aria-pressed="true"' : ' aria-pressed="false"') +
      '>' + e[1] + '</button>';
  }).join('');
  return '<div class="sc ' + PAL[i] + ' ' + HIER[i] + '"><div class="page">' +
    '<div class="etats" role="group" aria-label="État du passage">' + boutons + '</div>' +
    composant() + '</div></div>';
}

var variants = [
  function () { return carte(0); }, function () { return carte(1); },
  function () { return carte(2); }, function () { return carte(3); }
];

/* ------------------------------------------------------------------- panneau
   Les nombres qui restent à trancher. Chaque proposition arrive avec sa propre
   valeur de départ : c'est elle qu'on juge, pas une valeur commune arbitraire. */
var DEF = [
  { sp:1.00, r:4,  cd:40 },
  { sp:1.00, r:3,  cd:92 },
  { sp:1.05, r:2,  cd:46 },
  { sp:1.35, r:10, cd:54 }
];
var TYPO = [
  ["'Inter', system-ui, sans-serif",           "'JetBrains Mono', ui-monospace, monospace"],
  ["'Geist', system-ui, sans-serif",           "'Geist Mono', ui-monospace, monospace"],
  ["'Archivo', system-ui, sans-serif",         "'Space Mono', ui-monospace, monospace"],
  ["'Instrument Sans', system-ui, sans-serif", "'IBM Plex Mono', ui-monospace, monospace"]
];
var RAMPE  = ['zinc','neutral','stone','slate'];
var METHOD = ['par la couleur','par l’échelle','par le poids et la casse','par l’espace'];
var ACCENT = ['amber-500','sky-400','stone-50 (l’encre)','violet-400'];
/* encre secondaire sur le fond de carte (900) — WCAG 2.1, mesuré */
var INK = {
  zinc:    { 400:['oklch(70.5% .015 286.067)',6.74], 500:['oklch(55.2% .016 285.938)',3.67], 600:['oklch(44.2% .017 285.786)',2.29] },
  neutral: { 400:['oklch(70.8% 0 0)',6.91],          500:['oklch(55.6% 0 0)',3.79],          600:['oklch(43.9% 0 0)',2.30] },
  stone:   { 400:['oklch(70.9% .01 56.259)',6.76],   500:['oklch(55.3% .013 58.071)',3.64],  600:['oklch(44.4% .011 73.639)',2.29] },
  slate:   { 400:['oklch(70.4% .04 256.788)',6.79],  500:['oklch(55.4% .046 257.417)',3.74], 600:['oklch(44.6% .043 257.281)',2.36] }
};

function $(id) { return document.getElementById(id); }

function applyPanel() {
  var root = document.querySelector('.sc'); if (!root) return;
  var sp = +$('sp').value, r = +$('r').value, cd = +$('cd').value, lvl = $('i2').value;
  var ramp = RAMPE[current], ink = INK[ramp][lvl];
  root.style.setProperty('--sans', TYPO[current][0]);
  root.style.setProperty('--mono', TYPO[current][1]);
  root.style.setProperty('--sp', sp);
  root.style.setProperty('--r', r + 'px');
  root.style.setProperty('--cd', cd + 'px');
  root.style.setProperty('--i2', ink[0]);
  $('v-sp').textContent = sp.toFixed(2) + '×';
  $('v-r').textContent = r + ' px';
  $('v-cd').textContent = cd + ' px';
  $('v-i2').textContent = ink[1].toFixed(2) + ':1';
  $('v-i2').className = ink[1] < 4.5 ? 'ko' : '';
  $('out').textContent =
    'proposition ' + (current + 1) + ' · hiérarchie ' + METHOD[current] +
    ' · base ' + ramp + ' · accent ' + ACCENT[current] +
    ' · sans ' + TYPO[current][0].split(',')[0].replace(/'/g, '') +
    ' · mono ' + TYPO[current][1].split(',')[0].replace(/'/g, '') +
    ' · espace ' + sp.toFixed(2) + '× (base 4/8/12/16/22/32) · rayon ' + r + 'px' +
    ' · compte à rebours ' + cd + 'px · encre secondaire ' + ramp + '-' + lvl +
    ' (' + ink[1].toFixed(2) + ':1) · état ' + etat;
}

['sp','r','cd','i2'].forEach(function (id) {
  $(id).addEventListener('input', applyPanel);
  $(id).addEventListener('change', applyPanel);
});
$('copy').addEventListener('click', function (e) {
  navigator.clipboard.writeText($('out').textContent);
  e.target.textContent = 'Copié ✓';
  setTimeout(function () { e.target.textContent = 'Copier la configuration'; }, 1500);
});
</script>
<script src="assets/picker.js"></script>
<script>
/* le sélecteur d'état vit dans la proposition (il est thématisé) : on le
   recâble à chaque montage, et on rend le focus au bouton qu'on vient de
   presser — sinon le clavier repart du haut de la page à chaque bascule. */
function brancherEtats(focus) {
  var b = [].slice.call(document.querySelectorAll('.etat'));
  b.forEach(function (el, i) {
    el.addEventListener('click', function () {
      etat = el.dataset.etat;
      mount(current);
      requestAnimationFrame(function () {
        var n = document.querySelectorAll('.etat')[i];
        if (n) n.focus({ preventScroll: true });
      });
    });
  });
  if (focus) { /* rien : le focus est repris par l'appelant */ }
}

mount = function (i) {
  var reset = DEF[i];
  $('sp').value = reset.sp; $('r').value = reset.r; $('cd').value = reset.cd;
  stage.innerHTML = '';
  requestAnimationFrame(function () {
    stage.innerHTML = variants[i]();
    applyPanel();
    brancherEtats();
  });
};
mount(current);
</script>
</body>
