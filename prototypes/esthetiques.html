<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype · Esthétiques — cinq registres, deux thèmes</title>
<link rel="stylesheet" href="assets/picker.css">
<link rel="stylesheet" href="../data/vendor/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
/* La structure « Deux colonnes » est figée : le CSS ci-dessous est repris tel
   quel de prototypes/version.html. Seul le registre visuel et le thème changent. */

*{box-sizing:border-box;}
html,body{margin:0; padding:0;}
body{background:#09090b; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; font-synthesis:none;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }
.proto-lead{font:11px/1.5 ui-monospace,monospace; letter-spacing:.06em; color:#5d5d64; padding:12px 18px 0;}
#stage{min-height:100vh;}

.es{
  --pad:.8; --gap:1.4;
  --p1:calc(4px*var(--pad));  --p2:calc(8px*var(--pad));  --p3:calc(12px*var(--pad));
  --p4:calc(16px*var(--pad)); --p5:calc(22px*var(--pad)); --p6:calc(30px*var(--pad));
  --g:calc(14px*var(--gap)); --g2:calc(22px*var(--gap));
  /* rayons : un seul rayon décidé (--r-surface), les autres en découlent.
     Règle des rayons imbriqués — intérieur = extérieur − padding. */
  --r-surface:10px;
  --r-field:max(2px, calc(var(--r-surface) - var(--p5)));
  --r-control:999px;
  background:var(--bg); color:var(--i0); font-family:var(--sans);
  min-height:100vh; padding:var(--g) clamp(12px,2.4vw,34px) calc(var(--g2) * 3);
}
.es .page{max-width:1560px; margin:0 auto; display:flex; flex-direction:column; gap:var(--g2);}
.es .block{display:flex; flex-direction:column; gap:var(--p5);}
.es .sep{border:0; border-top:1px solid var(--line); margin:0; height:0; width:100%;}
.es .framed{background:var(--surf); box-shadow:0 0 0 1px var(--line); border-radius:var(--r-surface);
  padding:var(--p5); overflow:hidden;}

/* ------------------------------------------------------------ typographie */
.es h2{margin:0; font-size:14px; font-weight:600; letter-spacing:-.01em; color:var(--i0);
  display:flex; align-items:center; gap:var(--p2); padding-bottom:var(--p3); border-bottom:1px solid var(--line);}
.es .framed > h2{border-bottom:0; padding-bottom:0;}
.es h2 .ic{font-size:15px; color:var(--i2);}
.es h2 .meta{margin-left:auto; font-weight:400;}
.es .lab{font-size:10px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--i2);
  display:flex; align-items:center; gap:6px;}
.es .lab .ic{font-size:12px;}
.es .num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em; color:var(--i0);}
.es .prose{font-size:13px; line-height:1.65; color:var(--i1); max-width:64ch; text-wrap:pretty; margin:0;}
.es .meta{font-size:11.5px; color:var(--i2); letter-spacing:0;}

/* ------------------------------------------------------------- orientation */
.es .orient{display:flex; align-items:flex-start; gap:var(--p4); padding:var(--p4) var(--p5);
  background:var(--surf); border-radius:var(--r-surface); box-shadow:0 0 0 1px var(--line);}
.es .orient .badge{width:34px; height:34px; flex:none; border-radius:var(--r-control);
  display:flex; align-items:center; justify-content:center; background:var(--acc); color:var(--on-acc);}
.es .orient .badge .ic{font-size:17px;}
.es .orient.calm .badge{background:var(--surf-2); color:var(--i1);}
.es .orient .txt{display:flex; flex-direction:column; gap:4px; min-width:0;}
.es .orient .head{max-width:60ch; font-size:16px; font-weight:600; letter-spacing:-.015em; line-height:1.35; text-wrap:balance;}
.es .orient .head b{color:var(--acc); font-weight:600;}
.es .orient.calm .head b{color:var(--i0);}
.es .orient .sub{max-width:84ch; font-size:12.5px; color:var(--i1); line-height:1.55; text-wrap:pretty;}

/* ---------------------------------------------------------------- formes */
.es button,.es .btn{font-family:var(--sans); font-size:12px; font-weight:500; color:var(--i0);
  display:inline-flex; align-items:center; gap:7px; white-space:nowrap; text-decoration:none;
  background:var(--surf-2); border:0; border-radius:var(--r-control); padding:8px 15px; cursor:pointer;
  touch-action:manipulation;
  transition-property:background-color,color,transform; transition-duration:150ms; transition-timing-function:ease-out;}
.es button .ic,.es .btn .ic{font-size:14px; color:var(--i2);}
.es button:active,.es .btn:active{transform:scale(.96);}
.es button:focus-visible,.es .btn:focus-visible{outline:2px solid var(--i0); outline-offset:2px;}
@media (pointer:coarse){ .es button,.es .btn{min-height:44px;} }
.es .chip{font-size:11.5px; color:var(--i1); background:var(--surf-2); border-radius:var(--r-control);
  padding:5px 12px; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;}
.es .chip .ic{font-size:13px; color:var(--i2);}

/* ------------------------------------------------------------------ en-tête */
.es .hdr{flex-direction:row; align-items:center; gap:var(--p4); flex-wrap:wrap;}
.es .ident{display:flex; align-items:baseline; gap:var(--p2);}
.es .cs{font-family:var(--mono); font-size:18px; font-weight:600; letter-spacing:-.02em;}
.es .ident .meta b{font-family:var(--mono); color:var(--i1); font-weight:500;}
.es .hdr .chips{display:flex; gap:var(--p1); flex-wrap:wrap;}
.es .hdr .acts{display:flex; gap:var(--p1); margin-left:auto;}
.es .hdr .time{display:flex; align-items:baseline; gap:var(--p2); padding-left:var(--p4); border-left:1px solid var(--line);}
.es .hdr .time .num{font-size:19px; font-weight:500;}

/* -------------------------------------------------------------------- carte */
.es .maphead{display:flex; align-items:center; gap:var(--p3); flex-wrap:wrap;}
.es .legend{display:flex; gap:var(--p3); flex-wrap:wrap; margin-left:auto; font-size:11px; color:var(--i2);}
.es .legend span{display:flex; align-items:center; gap:5px;}
.es .legend i{width:8px; height:8px; border-radius:2px; flex:none;}
.es .legend .ic{font-size:12px;}
#map{background:var(--map-void); border-radius:var(--r-field); min-height:300px; flex:1;}
.leaflet-tile-pane{filter:var(--map-filter);}
.leaflet-container{background:var(--map-void); font-family:var(--mono); outline:0;}
.leaflet-control-zoom{border:0 !important; border-radius:var(--r-field); overflow:hidden;
  box-shadow:0 0 0 1px var(--line);}
.leaflet-control-zoom a{
  display:flex !important; align-items:center; justify-content:center;   /* glyphes centrés */
  width:30px; height:30px; line-height:1 !important; text-indent:0 !important;
  font-family:var(--sans); font-size:17px; font-weight:500;
  background:color-mix(in oklch, var(--surf) 88%, transparent) !important; color:var(--i0) !important;
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  border:0 !important; border-radius:0 !important;}
.leaflet-control-zoom a + a{border-top:1px solid var(--line) !important;}
.leaflet-control-zoom a:focus{outline:none;}
.leaflet-control-zoom a:focus-visible{outline:2px solid var(--i0) !important; outline-offset:-2px;}
.leaflet-control-attribution{background:color-mix(in oklch, var(--bg) 78%, transparent) !important;
  color:var(--i2) !important; font-family:var(--sans) !important; font-size:10px !important;}
.leaflet-control-attribution a{color:var(--i1) !important;}
.leaflet-div-icon{background:transparent !important; border:0 !important;}
.m-sat,.m-sta{display:flex; align-items:center; gap:6px; white-space:nowrap; font-family:var(--mono);
  font-weight:600; font-size:11.5px; letter-spacing:-.02em; color:#fff;
  text-shadow:0 0 3px #000,0 0 3px #000,0 0 7px #000;}
.m-sat i{flex:none; width:9px; height:9px; border-radius:50%; background:var(--acc); box-shadow:0 0 0 1.5px rgba(0,0,0,.85);}
.m-sta i{flex:none; width:9px; height:9px; border:2px solid #fff; box-shadow:0 0 0 1.5px rgba(0,0,0,.85);}

/* ------------------------------------------------------------ « maintenant » */
.es .now{display:grid; gap:var(--g2); align-items:stretch;}
.es .now > *{display:flex; flex-direction:column; min-width:0;}
.es .satline{display:flex; align-items:baseline; gap:var(--p3); flex-wrap:wrap;}
.es .satname{font-size:20px; font-weight:600; letter-spacing:-.022em; text-wrap:balance;}
.es .cdblock{display:flex; flex-direction:column; gap:2px;}
.es .cd{font-family:var(--mono); font-size:clamp(42px,5vw,var(--cd,76px)); font-weight:500; line-height:1.02;
  letter-spacing:-.045em; font-variant-numeric:tabular-nums;}
.es .cdl{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--i1);}
.es .cdl .ic{font-size:14px;}
.es .facts{display:grid; grid-template-columns:repeat(4,1fr); gap:var(--p4);}
@media (max-width:640px){ .es .facts{grid-template-columns:repeat(2,1fr);} }
.es .facts .num{font-size:15px; font-weight:500; margin-top:4px; display:block;}
.es .links{display:grid; grid-template-columns:1fr 1fr; gap:var(--p4) var(--g2);}
@media (max-width:640px){ .es .links{grid-template-columns:1fr;} }
.es .links .num{font-size:20px; font-weight:500; margin-top:5px; display:block;}
.es .links .dop{font-family:var(--mono); font-size:11.5px; color:var(--i1); margin-top:3px; font-variant-numeric:tabular-nums;}
.es .links .sub{font-size:11.5px; color:var(--i2); margin-top:6px;}

/* le palier courant — remonté ici parce que c'est l'action, pas une annexe */
.es .memo{display:flex; align-items:center; gap:var(--p3); flex-wrap:wrap;
  padding:var(--p3) var(--p4); border-radius:var(--r-field); background:var(--surf-2);}
.es .memo .tagm{font-family:var(--mono); font-size:12px; font-weight:600; color:var(--on-acc);
  background:var(--acc); border-radius:var(--r-control); padding:3px 10px;}
.es .memo .when{font-family:var(--mono); font-size:12px; color:var(--i1); font-variant-numeric:tabular-nums;}
.es .memo .hint{font-size:11.5px; color:var(--i2);}
.es .memo .more{margin-left:auto; font-size:11.5px; color:var(--i1); background:none; padding:4px 0;
  text-decoration:underline; text-underline-offset:3px;}

/* dépliants — l'accessoire s'ouvre, il ne s'empile pas */
.es details{border-top:1px solid var(--line); padding-top:var(--p5);}  /* = au gap du parent */
.es details.pushed{margin-top:auto;}
.es summary{list-style:none; cursor:pointer; display:flex; align-items:center; gap:var(--p2);
  font-size:12.5px; font-weight:500; color:var(--i1);}
.es summary::-webkit-details-marker{display:none;}
.es summary > .ic{color:var(--i2);}
.es summary .meta{margin-left:auto;}
/* fermé = pointe vers le bas (« ça se déroule »), ouvert = pointe vers le haut
   (« ça se replie »). Jamais droite/bas : la rotation doit dire l'axe du mouvement. */
.es summary::after{content:""; width:0; height:0; border-top:5px solid currentColor;
  border-left:4px solid transparent; border-right:4px solid transparent; flex:none;
  margin-left:var(--p3); transition:transform 150ms ease-out;}
.es details[open] summary::after{transform:rotate(180deg);}
.es summary:focus-visible{outline:2px solid var(--i0); outline-offset:3px; border-radius:4px;}
.es details .body{padding-top:var(--p4);}
.es .polarwrap{display:flex; flex-direction:column; align-items:center; gap:var(--p3);}
.es svg.polar{width:100%; max-width:250px; height:auto;}
.es .polar .ring{fill:none; stroke:var(--line); stroke-width:1;}
.es .polar .cone{fill:none; stroke:var(--warn); stroke-width:1; stroke-dasharray:3 4;}
.es .polar .cross{stroke:var(--line); stroke-width:1;}
.es .polar .trace{fill:none; stroke:var(--i1); stroke-width:2; stroke-linecap:round;}
.es .polar text{font-family:var(--sans); font-size:9px; font-weight:600; fill:var(--i2); letter-spacing:.06em;}
.es .conenote{display:flex; gap:var(--p2); width:100%;}
.es .conenote .ic{font-size:15px; color:var(--warn); flex:none; margin-top:1px;}

/* incrustation sur la carte (logique 2) */
.es .mapwrap{position:relative; display:flex; flex-direction:column; flex:1; gap:var(--p3);}
.es .overlay{position:absolute; left:var(--p4); bottom:var(--p4); z-index:500; max-width:min(94%,440px);
  display:flex; flex-direction:column; gap:var(--p2); padding:var(--p4) var(--p5);
  border-radius:var(--r-surface); background:color-mix(in oklch, var(--bg) 84%, transparent);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); box-shadow:0 0 0 1px var(--line);}
.es .overlay .cd{font-size:clamp(34px,4vw,46px);}
.es .overlay .row{display:flex; gap:var(--p4); flex-wrap:wrap;}
.es .overlay .row .num{font-size:15px; font-weight:500; display:block; margin-top:3px;}

/* bandeau compact (logique 3) */
.es .strip{display:flex; align-items:center; gap:var(--g2); flex-wrap:wrap;}
.es .strip .cdblock{flex:none;}
.es .strip .grow{flex:1; min-width:220px;}
.es .strip .inline{display:flex; gap:var(--g2); flex-wrap:wrap;}
.es .strip .inline > div{min-width:88px;}
.es .strip .inline .num{font-size:15px; font-weight:500; margin-top:4px; display:block;}

/* --------------------------------------------------------------- télémétrie */
.es .telem{display:grid; grid-template-columns:repeat(6,1fr); gap:var(--g2);}
@media (max-width:1100px){ .es .telem{grid-template-columns:repeat(3,1fr); gap:var(--p5) var(--g2);} }
@media (max-width:600px){ .es .telem{grid-template-columns:repeat(2,1fr);} }
.es .cell .num{font-size:16px; font-weight:500; margin-top:4px; display:block; white-space:nowrap;}
.es .cell .num small{font-family:var(--sans); font-size:11px; font-weight:400; color:var(--i2); margin-left:4px; letter-spacing:0;}
.es .cell.actionable .num,.es .cell.actionable .lab{color:var(--acc);}

/* ------------------------------------------------------------------ onglets */
.es .tabs{display:flex; gap:var(--p1); flex-wrap:wrap;}
.es .tabs button[aria-selected="true"]{background:var(--i0); color:var(--bg);}
.es .tabs button[aria-selected="true"] .ic{color:var(--bg);}
.es [role="tabpanel"][hidden]{display:none;}

.es .modes{display:grid; grid-template-columns:repeat(4,1fr); gap:var(--g2);}
@media (max-width:900px){ .es .modes{grid-template-columns:repeat(2,1fr); gap:var(--p5) var(--g2);} }
@media (max-width:520px){ .es .modes{grid-template-columns:1fr;} }
.es .mode{display:flex; flex-direction:column; gap:var(--p2);}
.es .stt{display:inline-flex; align-items:center; gap:5px; font-size:10px; font-weight:600;
  letter-spacing:.1em; text-transform:uppercase;}
.es .stt .ic{font-size:12px;}
.es .stt.on{color:var(--good);} .es .stt.off{color:var(--bad);}
.es .stt.sched{color:var(--warn);} .es .stt.idle{color:var(--i2);}
.es .mode .name{font-size:13px; font-weight:600;}
.es .mode .num{font-size:16px; font-weight:500;}
.es .mode .prose{font-size:11.5px; line-height:1.6;}

.es .plan{display:grid; grid-template-columns:repeat(5,1fr); gap:var(--g2);}
@media (max-width:900px){ .es .plan{grid-template-columns:repeat(2,1fr); gap:var(--p5) var(--g2);} }
.es .step .when{font-size:11px; color:var(--i2);}
.es .step .rx{font-family:var(--mono); font-size:15px; font-weight:500; margin-top:5px;
  font-variant-numeric:tabular-nums; letter-spacing:-.02em;}
.es .step .tx{font-family:var(--mono); font-size:12px; color:var(--i1); margin-top:3px; font-variant-numeric:tabular-nums;}
.es .step[data-now] .when,.es .step[data-now] .rx{color:var(--acc);}
.es .planfoot{display:flex; align-items:center; gap:var(--p4); flex-wrap:wrap;}

.es .tablewrap{overflow-x:auto;}
.es table{width:100%; border-collapse:collapse;}
.es thead th{text-align:left; font-size:10px; font-weight:600; letter-spacing:.12em; text-transform:uppercase;
  color:var(--i2); padding:0 var(--p3) var(--p3) 0; white-space:nowrap;}
.es thead th:last-child{padding-right:0;}
.es tbody td{padding:var(--p3) var(--p3) var(--p3) 0; border-top:1px solid var(--line);
  font-size:13px; color:var(--i1); vertical-align:baseline;}
.es tbody td:last-child{padding-right:0;}
.es tbody tr{cursor:pointer; touch-action:manipulation;}
.es tbody tr:focus-visible{outline:2px solid var(--i0); outline-offset:-2px;}
.es .satcell{font-weight:600; color:var(--i0);}
/* la ligne suivie n'a plus d'aplat : elle peut donc réagir au survol comme
   les autres. C'est le « on ne peut pas l'over, c'est bizarre » corrigé. */
.es tr[data-now] .satcell{color:var(--acc);}
.es tr[data-now] td{border-top-color:var(--acc);}
.es td.n{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--i0);
  white-space:nowrap; letter-spacing:-.02em;}
.es th.n{text-align:right;}
.es td .u{font-family:var(--mono); color:var(--i2); font-size:11px;}
.es .q{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; white-space:nowrap;}
.es .q::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor; flex:none;}
.es .q.good{color:var(--good);} .es .q.ok{color:var(--warn);} .es .q.poor{color:var(--i2);}

.es .form{display:flex; gap:var(--p3); flex-wrap:wrap; align-items:flex-end;}
.es .field{display:flex; flex-direction:column; gap:6px;}
.es .field input{font-family:var(--mono); font-size:16px; color:var(--i0); background:var(--bg);
  border:1px solid var(--line); border-radius:var(--r-field); padding:9px 12px; width:145px;}
.es .field input::placeholder{color:var(--i2);}
.es .field input:focus{outline:2px solid var(--i0); outline-offset:-1px; border-color:transparent;}

.es .gear{display:grid; grid-template-columns:repeat(3,1fr); gap:var(--g2);}
@media (max-width:760px){ .es .gear{grid-template-columns:1fr; gap:var(--p5);} }
.es .gearcard{display:flex; gap:var(--p3);}
.es .gearicon{width:32px; height:32px; flex:none; display:flex; align-items:center; justify-content:center;
  border-radius:var(--r-control); background:var(--surf-2); color:var(--i2);}
.es .gearicon .ic{font-size:17px;}
.es .gearcard .t{font-size:12.5px; font-weight:600;}
.es .gearcard .s{font-size:11.5px; color:var(--i2); margin-top:4px; line-height:1.6;}
.es footer{text-align:center; font-size:11px; color:var(--i2); line-height:1.8;}

.ic{width:1em; height:1em; flex:none; vertical-align:-.14em;}
.ic path,.ic circle,.ic rect{fill:currentColor;}


@media (hover:hover) and (pointer:fine){
  .es button:hover,.es .btn:hover{background:var(--line);}
  .es .tabs button[aria-selected="true"]:hover{background:var(--i0);}
  .es tbody tr:hover td{background:var(--surf-2);}   /* toutes les lignes, la suivie comprise */
  .es .memo .more:hover{background:none; color:var(--i0);}
  .es summary:hover{color:var(--i0);}
  .es .field input:hover{border-color:var(--i2);}
  .leaflet-control-zoom a:hover{background:var(--surf-2) !important;}
}

.panel{position:fixed; top:14px; right:14px; z-index:2147483646; width:258px; padding:11px 13px 13px;
  border-radius:12px; background:rgba(10,10,10,.88);
  -webkit-backdrop-filter:blur(12px) saturate(1.4); backdrop-filter:blur(12px) saturate(1.4);
  box-shadow:0 0 0 1px rgba(255,255,255,.08) inset, 0 8px 24px rgba(0,0,0,.24);
  font:12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:rgba(255,255,255,.82);}
.panel summary{cursor:pointer; list-style:none; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:rgba(255,255,255,.5); font-weight:600; display:flex; align-items:center; gap:7px; margin:0 0 10px;}
.panel summary::-webkit-details-marker{display:none;}
.panel summary::before{content:"▾"; font-size:9px;}
.panel:not([open]) summary{margin:0;} .panel:not([open]) summary::before{content:"▸";}
.panel:not([open]){width:auto; padding:9px 13px;}
.panel summary:focus-visible{outline:2px solid rgba(255,255,255,.5); outline-offset:3px; border-radius:4px;}
.panel label{display:block; margin-bottom:10px;}
.panel .row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px;}
.panel .row b{font-weight:500; font-size:11.5px;}
.panel .row span{font-family:ui-monospace,monospace; font-size:11px; color:rgba(255,255,255,.55); font-variant-numeric:tabular-nums;}
.panel input[type=range]{width:100%; margin:0; accent-color:#fff; height:18px;}
.panel select{width:100%; font:inherit; font-size:11.5px; padding:5px 7px; border-radius:7px;
  background:rgba(255,255,255,.09); color:#fff; border:1px solid rgba(255,255,255,.12);}
.panel hr{border:0; border-top:1px solid rgba(255,255,255,.1); margin:12px 0;}
.panel .out{margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,.1);
  font-family:ui-monospace,monospace; font-size:10px; line-height:1.65; color:rgba(255,255,255,.5);
  word-break:break-word; user-select:all;}
.panel .copy{width:100%; margin-top:8px; font:inherit; font-size:11px; padding:6px; border-radius:7px;
  background:rgba(255,255,255,.12); color:#fff; border:0; cursor:pointer;}
.panel .copy:hover{background:rgba(255,255,255,.2);}
@media (max-width:920px){ .panel{position:static; width:auto; margin:12px 18px 0;} }

/* =========================================================================
   CINQ ESTHÉTIQUES × DEUX THÈMES
   La structure et la composition sont figées. Ce qui change : palette,
   couple typographique, traitement de surface, système de rayons.

   Un thème n'est pas une image en négatif. On permute les RÔLES le long de
   la rampe Tailwind, et surtout on **remonte l'accent dans sa rampe** :
   une teinte lisible sur du noir ne l'est presque jamais sur du blanc.

   Paliers d'encre, contrastes mesurés :
     sombre  fond 950  →  i0 50 (~18:1) · i1 300 (~12:1) · i2 400 (~6,8:1)
     clair   fond 50   →  i0 900 (~18:1) · i1 700 (~10,4:1) · i2 600 (~7,7:1)
   Le 500 passe de justesse en clair (4,7:1) ; on garde la marge du sombre.

   Accents en clair, mesurés sur blanc (4,5:1 exigé pour du texte) :
     amber-500 2,15 ✗  amber-600 3,19 ✗  amber-700 5,05 ✓
     cyan-600  3,60 ✗  cyan-700  5,28 ✓
     indigo-500 4,58 ~ indigo-600 6,44 ✓
     red-500   3,82 ✗  red-600   4,76 ✓
     yellow-700 4,92 ✓ — mais Bloc n'écrit jamais en jaune, il en fait un aplat.

   Filets : en clair une alpha noire recule (elle se compose avec le dessous) ;
   en sombre un palier plein reste discret là où une alpha blanche brille.
   ========================================================================= */

.a-sobre { --sans:'Inter', system-ui, sans-serif;         --mono:'JetBrains Mono', ui-monospace, monospace; --r-surface:10px; }
.a-verre { --sans:'Space Grotesk', system-ui, sans-serif; --mono:'JetBrains Mono', ui-monospace, monospace; --r-surface:14px; }
.a-studio{ --sans:'Inter', system-ui, sans-serif;         --mono:'JetBrains Mono', ui-monospace, monospace; --r-surface:14px; }
.a-encre { --sans:'IBM Plex Sans', system-ui, sans-serif; --mono:'IBM Plex Mono', ui-monospace, monospace;  --r-surface:2px; }
.a-bloc  { --sans:'Archivo', system-ui, sans-serif;       --mono:'Space Mono', ui-monospace, monospace;     --r-surface:0px; --r-control:0px; }

/* ───────────────────────────────────────────────────────────── 1 · SOBRE
   La référence validée : gris neutres, ambre rationné, surfaces plates
   tenues par un anneau d'un pixel. Aucun effet. */
.a-sobre[data-theme="dark"]{
  --bg:oklch(14.5% 0 0); --surf:oklch(20.5% 0 0); --surf-2:oklch(26.9% 0 0); --line:oklch(26.9% 0 0);
  --i0:oklch(98.5% 0 0); --i1:oklch(87% 0 0); --i2:oklch(70.8% 0 0);
  --acc:oklch(76.9% .188 70.08); --on-acc:oklch(14.5% 0 0);
  --good:oklch(76.5% .177 163.223); --warn:oklch(82.8% .189 84.429); --bad:oklch(70.4% .191 22.216);
  --map-void:oklch(18% 0 0); --map-filter:saturate(0) contrast(1.15) brightness(.68) sepia(.4) hue-rotate(-12deg);
}
.a-sobre[data-theme="light"]{
  --bg:oklch(97% 0 0); --surf:oklch(100% 0 0); --surf-2:oklch(96% 0 0); --line:oklch(0% 0 0 / .10);
  --i0:oklch(20.5% 0 0); --i1:oklch(37.1% 0 0); --i2:oklch(43.9% 0 0);
  --acc:oklch(55.5% .163 48.998); --on-acc:oklch(100% 0 0);
  --good:oklch(59.6% .145 163.225); --warn:oklch(55.5% .163 48.998); --bad:oklch(57.7% .245 27.325);
  --map-void:oklch(92% 0 0); --map-filter:saturate(.3) contrast(1.02) brightness(1.04) sepia(.25);
}

/* ───────────────────────────────────────────────────────────── 2 · VERRE
   Poste de pilotage 2026. En sombre : verre dépoli, blanc translucide sur
   bleu-nuit. En clair il ne peut plus être translucide blanc sur noir — il
   devient blanc opaque à 70 % sur un fond teinté, liseré sombre. */
.a-verre[data-theme="dark"]{
  --bg:oklch(12.5% .028 264); --surf:oklch(100% 0 0 / .045); --surf-2:oklch(100% 0 0 / .085);
  --line:oklch(100% 0 0 / .11); --glass-hi:oklch(100% 0 0 / .09);
  --i0:oklch(98% .008 250); --i1:oklch(85% .02 250); --i2:oklch(70% .03 250);
  --acc:oklch(84% .14 200); --on-acc:oklch(12.5% .028 264);
  --good:oklch(80% .16 165); --warn:oklch(85% .17 88); --bad:oklch(72% .19 20);
  --map-void:oklch(15% .03 264); --map-filter:saturate(.25) contrast(1.2) brightness(.6) hue-rotate(-8deg);
  background:
    radial-gradient(ellipse 90rem 40rem at 15% -10%, oklch(84% .14 200 / .10), transparent 60%),
    radial-gradient(ellipse 70rem 40rem at 100% 0%, oklch(67% .18 277 / .09), transparent 58%),
    var(--bg);
}
.a-verre[data-theme="light"]{
  --bg:oklch(96.5% .012 235); --surf:oklch(100% 0 0 / .70); --surf-2:oklch(100% 0 0 / .95);
  --line:oklch(30% .04 250 / .14); --glass-hi:oklch(100% 0 0 / .8);
  --i0:oklch(24% .03 250); --i1:oklch(40% .03 250); --i2:oklch(48% .03 250);
  --acc:oklch(52% .105 223.128); --on-acc:oklch(100% 0 0);
  --good:oklch(59.6% .145 163.225); --warn:oklch(55.4% .135 66.442); --bad:oklch(57.7% .245 27.325);
  --map-void:oklch(90% .015 235); --map-filter:saturate(.4) contrast(1.02) brightness(1.03) hue-rotate(-6deg);
  background:
    radial-gradient(ellipse 90rem 40rem at 15% -10%, oklch(52% .105 223 / .10), transparent 60%),
    radial-gradient(ellipse 70rem 40rem at 100% 0%, oklch(51% .262 277 / .07), transparent 58%),
    var(--bg);
}
.a-verre .framed,.a-verre .orient{
  -webkit-backdrop-filter:blur(16px) saturate(1.3); backdrop-filter:blur(16px) saturate(1.3);
  box-shadow:0 0 0 1px var(--line), inset 0 1px 0 var(--glass-hi);}
.a-verre .lab{letter-spacing:.18em;}
.a-verre[data-theme="dark"] .cd{text-shadow:0 0 32px oklch(84% .14 200 / .35);}
.a-verre .chip,.a-verre button,.a-verre .btn,.a-verre .memo{box-shadow:inset 0 0 0 1px var(--line);}
.a-verre .tabs button[aria-selected="true"]{box-shadow:none;}

/* ──────────────────────────────────────────────────────────── 3 · STUDIO
   L'application soignée. Native en clair ; son jumeau sombre garde les
   rayons généreux mais réduit les ombres à un anneau — une ombre empilée
   ne se voit pas sur un fond noir. */
.a-studio[data-theme="light"]{
  --bg:oklch(97.2% .003 250); --surf:oklch(100% 0 0); --surf-2:oklch(96.5% .004 250);
  --line:oklch(0% 0 0 / .09);
  --i0:oklch(20.8% .042 265.755); --i1:oklch(37.2% .044 257.287); --i2:oklch(44.6% .043 257.281);
  --acc:oklch(51.1% .262 276.966); --on-acc:oklch(100% 0 0);
  --good:oklch(59.6% .145 163.225); --warn:oklch(55.5% .163 48.998); --bad:oklch(57.7% .245 27.325);
  --map-void:oklch(92% .004 250); --map-filter:saturate(.35) contrast(1.05) brightness(1.02);
}
.a-studio[data-theme="dark"]{
  --bg:oklch(14.5% .01 262); --surf:oklch(20.5% .012 262); --surf-2:oklch(26.9% .012 262);
  --line:oklch(26.9% .012 262);
  --i0:oklch(98.4% .003 247.858); --i1:oklch(86.9% .022 252.894); --i2:oklch(70.4% .04 256.788);
  --acc:oklch(67.3% .182 276.935); --on-acc:oklch(14.5% .01 262);
  --good:oklch(76.5% .177 163.223); --warn:oklch(82.8% .189 84.429); --bad:oklch(70.4% .191 22.216);
  --map-void:oklch(18% .01 262); --map-filter:saturate(.2) contrast(1.15) brightness(.66);
}
.a-studio[data-theme="light"] .framed,.a-studio[data-theme="light"] .orient{
  box-shadow:0 0 0 1px oklch(0% 0 0 / .05), 0 1px 2px oklch(0% 0 0 / .05), 0 8px 20px -10px oklch(0% 0 0 / .13);}
.a-studio[data-theme="dark"] .framed,.a-studio[data-theme="dark"] .orient{box-shadow:0 0 0 1px var(--line);}

/* ───────────────────────────────────────────────────────────── 4 · ENCRE
   Registre imprimé : rien n'est rempli, tout est tenu par des filets. */
.a-encre[data-theme="dark"]{
  --bg:oklch(14.8% .004 62); --surf:transparent; --surf-2:oklch(100% 0 0 / .05); --line:oklch(32% .006 62);
  --i0:oklch(96% .008 80); --i1:oklch(80% .012 74); --i2:oklch(66% .014 70);
  --acc:oklch(66% .21 25); --on-acc:oklch(96% .008 80);
  --good:oklch(74% .12 160); --warn:oklch(80% .13 80); --bad:oklch(66% .21 25);
  --map-void:oklch(17% .005 62); --map-filter:saturate(0) contrast(1.3) brightness(.58);
}
.a-encre[data-theme="light"]{
  --bg:oklch(97% .004 92); --surf:transparent; --surf-2:oklch(0% 0 0 / .045); --line:oklch(0% 0 0 / .16);
  --i0:oklch(21.6% .006 56.043); --i1:oklch(37.4% .01 67.558); --i2:oklch(44.4% .011 73.639);
  --acc:oklch(57.7% .245 27.325); --on-acc:oklch(100% 0 0);
  --good:oklch(59.6% .145 163.225); --warn:oklch(55.4% .135 66.442); --bad:oklch(57.7% .245 27.325);
  --map-void:oklch(93% .006 92); --map-filter:saturate(0) contrast(1.1) brightness(1.06);
}
.a-encre .framed,.a-encre .orient{background:transparent; box-shadow:0 0 0 1px var(--line);}
.a-encre .orient .badge{background:transparent; box-shadow:inset 0 0 0 1px var(--acc); color:var(--acc);}
.a-encre .lab{letter-spacing:.2em; font-weight:500;}
.a-encre .chip,.a-encre button,.a-encre .btn,.a-encre .memo,.a-encre .gearicon{
  background:transparent; box-shadow:inset 0 0 0 1px var(--line);}
.a-encre .tabs button[aria-selected="true"]{background:var(--i0); box-shadow:none;}
.a-encre .cell .num,.a-encre .facts .num{font-weight:400;}

/* ────────────────────────────────────────────────────────────── 5 · BLOC
   Contraste maximal, rayon zéro, bandeaux inversés. Le jaune n'est jamais
   du texte : c'est un aplat. Il traverse donc les deux thèmes au même
   palier — seul ce qu'il y a autour s'inverse. */
.a-bloc[data-theme="dark"]{
  --bg:oklch(11% 0 0); --surf:oklch(17% 0 0); --surf-2:oklch(26% 0 0); --line:oklch(38% 0 0);
  --i0:oklch(100% 0 0); --i1:oklch(84% 0 0); --i2:oklch(68% 0 0);
  --acc:oklch(85.2% .199 91.936); --on-acc:oklch(11% 0 0);
  --good:oklch(84% .18 140); --warn:oklch(85.2% .199 91.936); --bad:oklch(66% .22 22);
  --map-void:oklch(14% 0 0); --map-filter:saturate(0) contrast(1.35) brightness(.6);
}
.a-bloc[data-theme="light"]{
  --bg:oklch(100% 0 0); --surf:oklch(97% 0 0); --surf-2:oklch(90% 0 0); --line:oklch(0% 0 0 / .84);
  --i0:oklch(11% 0 0); --i1:oklch(30% 0 0); --i2:oklch(43.9% 0 0);
  --acc:oklch(85.2% .199 91.936); --on-acc:oklch(11% 0 0);
  --good:oklch(45% .15 150); --warn:oklch(55.4% .135 66.442); --bad:oklch(50% .22 27);
  --map-void:oklch(94% 0 0); --map-filter:saturate(0) contrast(1.2) brightness(1.05);
}
.a-bloc h2{background:var(--i0); color:var(--bg); font-weight:700; letter-spacing:.01em;
  margin:calc(var(--p5) * -1) calc(var(--p5) * -1) 0; padding:var(--p3) var(--p5); border-bottom:0;}
.a-bloc h2 .ic{color:var(--bg);} .a-bloc h2 .meta{color:color-mix(in oklch, var(--bg) 66%, transparent);}
.a-bloc .satname,.a-bloc .cd{font-weight:700;}
.a-bloc .lab{font-weight:700; letter-spacing:.14em;}
.a-bloc .chip{box-shadow:inset 0 0 0 1px var(--line); background:transparent;}
.a-bloc .orient .badge,.a-bloc .memo .tagm,.a-bloc .gearicon{border-radius:0;}
.a-bloc .memo .tagm{font-weight:700;}
.a-bloc .tabs button[aria-selected="true"]{background:var(--acc); color:var(--on-acc);}
.a-bloc .tabs button[aria-selected="true"] .ic{color:var(--on-acc);}
/* le rebours en jaune sur blanc serait illisible : en clair il devient un aplat */
.a-bloc[data-theme="light"] [data-now] .cd{color:var(--i0); background:var(--acc);
  align-self:flex-start; padding:0 var(--p3);}
.a-bloc[data-theme="light"] [data-now] .cdl{color:var(--i0);}
.a-bloc[data-theme="light"] .cell.actionable .num,
.a-bloc[data-theme="light"] .cell.actionable .lab{color:oklch(45% .12 75);}

/* ────────────────────────── repères de carte : ils suivent le thème, pas
   l'esthétique — encre claire sur tuiles sombres, encre sombre sur claires */
[data-theme="light"] .m-sat,[data-theme="light"] .m-sta{
  color:oklch(15% 0 0); text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 7px #fff;}
[data-theme="light"] .m-sta i{border-color:oklch(15% 0 0);}

@media (hover:hover) and (pointer:fine){
  .a-verre button:hover,.a-verre .btn:hover{background:color-mix(in oklch, var(--i0) 12%, transparent);}
  .a-studio button:hover,.a-studio .btn:hover{background:color-mix(in oklch, var(--i0) 8%, transparent);}
  .a-encre button:hover,.a-encre .btn:hover{background:color-mix(in oklch, var(--i0) 8%, transparent);}
  .a-bloc button:hover,.a-bloc .btn:hover{background:var(--i0); color:var(--bg);}
  .a-bloc button:hover .ic,.a-bloc .btn:hover .ic{color:var(--bg);}
}

</style>

          '<td><span class="q ' + r[8] + '">' + r[7] + '</span></td></tr>'; }).join('') +
      '</tbody></table></div></div>'],
    ['Sliders','Réglage du poste',
      '<div class="block"><div class="plan">' + PLAN.map(function (s) {
        return '<div class="step"' + (s[3] ? ' data-now' : '') + '><div class="when">' + s[0] + '</div>' +
          '<div class="rx">RX ' + s[1] + '</div><div class="tx">TX ' + s[2] + '</div></div>'; }).join('') + '</div>' +
      '<hr class="sep"><div class="planfoot"><button type="button">' + ic('Download') + 'Exporter les mémoires (CSV)</button>' +
      '<span class="prose" style="font-size:11.5px">Le FTM-500D n’a pas de commande CAT : ces cinq mémoires se ' +
      'sélectionnent à la molette aux horaires indiqués.</span></div></div>'],
    ['Satellite','Radio de l’ISS',
      '<div class="block"><div class="modes">' + ISS.map(function (m) {
        return '<div class="mode"><span class="stt ' + m[0] + '">' + ic(m[1]) + m[2] + '</span>' +
          '<div class="name">' + m[3] + '</div><span class="num">' + m[4] + '</span>' +
          '<p class="prose">' + m[5] + '</p></div>'; }).join('') + '</div></div>'],
    ['Notebook','Journal',
      '<div class="block"><div class="form">' +
      '<label class="field"><span class="lab">Indicatif</span><input placeholder="F1ABC" autocomplete="off"></label>' +
      '<label class="field"><span class="lab">Locator</span><input placeholder="JN38" autocomplete="off"></label>' +
      '<label class="field"><span class="lab">RST envoyé</span><input value="59"></label>' +
      '<label class="field"><span class="lab">RST reçu</span><input value="59"></label>' +
      '<label class="field"><span class="lab">Note</span><input placeholder="via AO-91" autocomplete="off"></label>' +
      '<button type="button">' + ic('Save') + 'Enregistrer le QSO</button>' +
      '<a class="btn" href="#">' + ic('Download') + 'Télécharger l’ADIF</a></div></div>'],
    ['Radio','Station',
      '<div class="block"><div class="gear">' + GEAR.map(function (g) {
        return '<div class="gearcard"><div class="gearicon">' + ic(g[0]) + '</div>' +
          '<div><div class="t">' + g[1] + '</div><div class="s">' + g[2] + '</div></div></div>'; }).join('') + '</div></div>']
  ];
  return '<section class="block framed"><div class="tabs" role="tablist">' +
    T.map(function (t, i) { return '<button type="button" role="tab" id="tb' + i + '" aria-controls="tp' + i +
      '" aria-selected="' + (i === 0) + '">' + ic(t[0]) + t[1] + '</button>'; }).join('') + '</div>' +
    T.map(function (t, i) { return '<div role="tabpanel" id="tp' + i + '" aria-labelledby="tb' + i + '"' +
      (i ? ' hidden' : '') + '>' + t[2] + '</div>'; }).join('') + '</section>';
}
var FOOT = '<footer>JB-SATRACK · station F4MAJ · TLE CelesTrak · statut ISS ARISS · calcul SGP4 satellite.js<br>' +
  '© 2026 F4MAJ &amp; Claude IA (Anthropic) — création conjointe</footer>';
var shell = function (i) { return '<div class="es"><div class="page">' + i + '</div></div>'; };
var H2 = '<h2>' + ic('Activity') + 'Qu’est-ce qui se passe actuellement ?</h2>';

/* ===================================================== 1 · DEUX COLONNES
   Ce que tu décrivais : les informations à gauche, la carte à droite et en
   haut. La carte s'étire à la hauteur de la colonne de gauche, donc rien ne
   dépasse. Trajectoire et note en dépliants sous les informations. */
function vColonnes(){
  return shell(header() + orient() +
    '<section class="block framed">' + H2 +
      '<div class="now" style="grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)">' +
        '<div class="block">' +
          '<div class="satline"><span class="satname">AO-91 (RadFxSat / Fox-1B)</span>' +
          '<span class="chip">Transpondeur linéaire inversé</span></div>' +
          cd() + facts() + links() + memo() + details(true) +
        '</div>' +
        '<div class="mapwrap">' + mapBlock() + '</div>' +
      '</div>' +
    '</section>' + telem() + tabs() + FOOT);
}

/* ================================================== 2 · CARTE INCRUSTÉE
   La carte prend tout le haut, et le compte à rebours vient se poser dessus.
   Le plus compact verticalement, et la carte redevient ce qu'elle est dans ce
   produit : le sujet, pas une illustration. Risque : l'incrustation masque
   une portion de carte, et le fond translucide dépend de ce qu'il y a dessous. */
function vIncruste(){
  return shell(header() + orient() +
    '<section class="block framed">' + H2 +
      '<div class="mapwrap" style="min-height:440px">' + mapBlock() +
        '<div class="overlay">' +
          '<div class="satline"><span class="satname" style="font-size:16px">AO-91 (RadFxSat / Fox-1B)</span></div>' +
          cd() +
          '<div class="row"><div><div class="lab">' + ic('ArrowDown') + 'Downlink</div>' +
          '<span class="num">435.2494</span></div>' +
          '<div><div class="lab">' + ic('ArrowUp') + 'Uplink</div><span class="num">145.9600</span></div>' +
          '<div><div class="lab">Élév. max</div><span class="num">81°</span></div></div>' +
        '</div>' +
      '</div>' +
      '<hr class="sep">' + facts() + links() + memo() + details() +
    '</section>' + telem() + tabs() + FOOT);
}

/* ================================================ 3 · BANDEAU + CARTE
   Tout le « maintenant » tient sur une bande horizontale : rebours, nom,
   quatre faits, deux fréquences. La carte s'étale dessous en pleine largeur.
   Le plus lisible d'un coup d'œil ; le moins hiérarchisé, tout est au même rang. */
function vBandeau(){
  return shell(header() + orient() +
    '<section class="block framed">' + H2 +
      '<div class="strip">' + cd() +
        '<div class="grow"><div class="satline"><span class="satname" style="font-size:17px">AO-91 (RadFxSat / Fox-1B)</span>' +
        '<span class="chip">Transpondeur linéaire inversé</span></div>' +
        '<div class="inline" style="margin-top:var(--p3)">' + FACTS.map(function (f) {
          return '<div><div class="lab">' + f[0] + '</div><span class="num">' + f[1] + '</span></div>'; }).join('') +
        '<div><div class="lab">' + ic('ArrowDown') + 'Downlink</div><span class="num">435.2494</span></div>' +
        '<div><div class="lab">' + ic('ArrowUp') + 'Uplink</div><span class="num">145.9600</span></div>' +
        '</div></div>' +
      '</div>' + memo() +
      '<div class="mapwrap" style="min-height:400px">' + mapBlock() + '</div>' +
      details() +
    '</section>' + telem() + tabs() + FOOT);
}


/* onglets — délégation : rien à recâbler à chaque remontage */
function selectTab(b){
  var list = b.closest('[role="tablist"]');
  [...list.querySelectorAll('[role="tab"]')].forEach(function (t) {
    var on = t === b;
    t.setAttribute('aria-selected', on);
    document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
  });
}
document.addEventListener('click', function (e) {
  var t = e.target.closest && e.target.closest('[role="tab"]');
  if (t) return selectTab(t);
  var g = e.target.closest && e.target.closest('[data-goto]');
  if (g) { var b = document.getElementById('tb' + g.dataset.goto); if (b) { selectTab(b); b.focus();
    b.scrollIntoView({ behavior:'smooth', block:'nearest' }); } }
});
document.addEventListener('keydown', function (e) {
  var b = document.activeElement;
  if (!b || b.getAttribute('role') !== 'tab') return;
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  var t = [...b.closest('[role="tablist"]').querySelectorAll('[role="tab"]')];
  var i = (t.indexOf(b) + (e.key === 'ArrowRight' ? 1 : -1) + t.length) % t.length;
  t[i].focus(); selectTab(t[i]); e.preventDefault();
});

var _map = null;
function mountMap(){
  var el = document.getElementById('map');
  if (_map) { _map.remove(); _map = null; }
  if (!el || typeof L === 'undefined') return;
  var IM='https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
  var LB='https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}';
  var map = _map = L.map(el, { zoomSnap:0, zoomDelta:.5, wheelPxPerZoomLevel:70, wheelDebounceTime:20,
    maxBoundsViscosity:1 });
  /* Un tracker doit s'ouvrir sur le monde entier : la trace au sol fait le tour
     de la Terre, la couper d'entrée n'a pas de sens. Le zoom d'ouverture EST le
     plancher calculé — c'est aussi le plus petit qu'on puisse atteindre. */
  var mz = Math.log2(Math.max(el.clientWidth, el.clientHeight)/256);
  map.setMinZoom(mz); map.setMaxBounds([[-85.05,-180],[85.05,180]]);
  map.setView([22, 8], mz);
  var T = { noWrap:true, bounds:[[-85.05,-180],[85.05,180]], maxZoom:17, updateWhenZooming:false, updateWhenIdle:false };
  L.tileLayer(IM, Object.assign({ maxNativeZoom:3, keepBuffer:12 }, T)).addTo(map);
  L.tileLayer(IM, Object.assign({ keepBuffer:6, attribution:'Esri, Maxar, Earthstar Geographics' }, T)).addTo(map);
  L.tileLayer(LB, Object.assign({ keepBuffer:6 }, T)).addTo(map);
  var css = getComputedStyle(document.querySelector('.es'));
  var acc = css.getPropertyValue('--acc').trim(), ink = css.getPropertyValue('--i0').trim();
  L.polygon([[90,-180],[90,-40],[10,-30],[-40,-60],[-90,-90],[-90,-180]],
    { stroke:false, fillColor:'#000', fillOpacity:.45, interactive:false }).addTo(map);
  L.polyline([[20,-70],[35,-40],[44,-14],[48,6]], { color:ink, weight:1.5, opacity:.4, interactive:false }).addTo(map);
  L.polyline([[48,6],[52,26],[50,54],[38,84]], { color:ink, weight:2.5, opacity:.9, interactive:false }).addTo(map);
  L.circle([51.4,25.5], { radius:2600000, color:ink, weight:1.5, opacity:.6, fillColor:ink, fillOpacity:.06, interactive:false }).addTo(map);
  L.polyline([[47.77,7.34],[51.4,25.5]], { color:acc, weight:1.5, dashArray:'5,5', interactive:false }).addTo(map);
  L.marker([51.4,25.5], { icon:L.divIcon({ className:'', iconAnchor:[5,10], html:'<div class="m-sat"><i></i>AO-91</div>' }) }).addTo(map);
  L.marker([47.77,7.34], { icon:L.divIcon({ className:'', iconAnchor:[5,10], html:'<div class="m-sta"><i></i>F4MAJ</div>' }) }).addTo(map);
  var ro = new ResizeObserver(function(){
    if (!_map) return; _map.invalidateSize();
    var z = Math.log2(Math.max(el.clientWidth, el.clientHeight)/256);
    _map.setMinZoom(z); if (_map.getZoom() < z) _map.setZoom(z);
  });
  ro.observe(el);
}


var AES = ['a-sobre', 'a-verre', 'a-studio', 'a-encre', 'a-bloc'];
var variants = AES.map(function (cls) {
  return function () { return vColonnes().replace('class="es"', 'class="es ' + cls + '"'); };
});

/* Le thème est résolu en JS et posé en attribut : les blocs CSS sont explicites
   (.a-x[data-theme="light"] / ["dark"]), donc aucune cascade à deviner.
   « Système » écoute prefers-color-scheme et suit les changements à chaud. */
var mqDark = matchMedia('(prefers-color-scheme: dark)');
function themeChoisi(){ return document.getElementById('theme').value; }
function themeResolu(){
  var c = themeChoisi();
  return c === 'auto' ? (mqDark.matches ? 'dark' : 'light') : c;
}
function applyTheme(){
  var root = document.querySelector('.es'); if (!root) return;
  var t = themeResolu();
  root.dataset.theme = t;
  document.body.dataset.theme = t;          /* pour les repères de carte */
  document.getElementById('v-th').textContent =
    themeChoisi() === 'auto' ? t + ' (système)' : t;
}
mqDark.addEventListener('change', function(){ if (themeChoisi() === 'auto') { applyTheme(); applyPanel(); } });

function applyPanel(){
  var root = document.querySelector('.es'); if (!root) return;
  applyTheme();
  var pad=+document.getElementById('pad').value, gap=+document.getElementById('gap').value,
      cdv=+document.getElementById('cd').value, rad=+document.getElementById('r').value;
  root.style.setProperty('--pad', pad);
  root.style.setProperty('--gap', gap);
  root.style.setProperty('--cd', cdv + 'px');
  if (rad < 0) root.style.removeProperty('--r-surface');
  else root.style.setProperty('--r-surface', rad + 'px');
  document.getElementById('v-pad').textContent = pad.toFixed(2) + '×';
  document.getElementById('v-gap').textContent = gap.toFixed(2) + '×';
  document.getElementById('v-cd').textContent = cdv + ' px';
  var cs = getComputedStyle(root);
  document.getElementById('v-r').textContent = rad < 0
    ? cs.getPropertyValue('--r-surface').trim() + ' (hérité)' : rad + ' px (forcé)';
  document.getElementById('out').textContent =
    'esthetique: ' + AES[current].replace('a-','') + ' · theme: ' + root.dataset.theme +
    (themeChoisi() === 'auto' ? ' (systeme)' : '') + ' · etat: ' + ETAT +
    ' · sans: ' + cs.getPropertyValue('--sans').split(',')[0].replace(/[\'"]/g,'').trim() +
    ' · mono: ' + cs.getPropertyValue('--mono').split(',')[0].replace(/[\'"]/g,'').trim() +
    ' · accent: ' + cs.getPropertyValue('--acc').trim() +
    ' · rayon: ' + cs.getPropertyValue('--r-surface').trim() +
    ' · padding: ' + pad.toFixed(2) + 'x · ecart: ' + gap.toFixed(2) + 'x · rebours: ' + cdv + 'px';
}
['pad','gap','cd','r'].forEach(function(id){
  document.getElementById(id).addEventListener('input', applyPanel);
  document.getElementById(id).addEventListener('change', applyPanel);
});
document.getElementById('theme').addEventListener('change', function(){ applyPanel(); mountMap(); });
document.getElementById('etat').addEventListener('change', function(e){ ETAT = e.target.value; mount(current); });
document.getElementById('copy').addEventListener('click', function(e){
  navigator.clipboard.writeText(document.getElementById('out').textContent);
  e.target.textContent = 'Copié ✓';
  setTimeout(function(){ e.target.textContent = 'Copier la configuration'; }, 1500);
});
</script>
<script src="assets/picker.js"></script>
<script>
mount = function (i) { stage.innerHTML = ''; requestAnimationFrame(function () {
  stage.innerHTML = variants[i](); applyPanel(); mountMap(); }); };
mount(current);
</script>
