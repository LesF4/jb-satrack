<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype · Carte — quatre moteurs, mêmes surcouches, mesures à l'écran</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/picker.css">
<link rel="stylesheet" href="../data/vendor/leaflet.css">
<!-- PROTOTYPE UNIQUEMENT : en production, ce fichier sera vendorisé par app.py
     (ensure_maplibre_js / ensure_maplibre_css) et servi sur /vendor/maplibre-gl.js|css. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* =========================================================================
   CARTE — comparatif de moteurs.
   Le contenu est identique dans les quatre variantes : mêmes surcouches, même
   traitement des tuiles, mêmes réglages au panneau. Seul le moteur change.
   Rien n'est thématisé ici : la couleur est un bruit dans une mesure.
   ========================================================================= */
:root{
  --bg:#09090b; --surf:#141417; --surf-2:#1e1e23; --line:rgba(255,255,255,.09);
  --i0:#f4f4f5; --i1:#a1a1aa; --i2:#71717a;
  --acc:#f97316;                      /* satellite / liaison — jamais les tuiles */
  --ink:#e4e4e7;                      /* traces au sol */
  --map-void:#0b0f14;                 /* le fond du conteneur : jamais visible */
  --sans:'Inter', system-ui, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, monospace;
  /* traitement des tuiles — piloté par le panneau, jamais appliqué aux surcouches */
  --map-sat:0; --map-con:1.16; --map-bri:.70;
  --map-filter:saturate(var(--map-sat)) contrast(var(--map-con)) brightness(var(--map-bri));
}
*{box-sizing:border-box;}
html,body{margin:0; padding:0;}
body{background:var(--bg); color:var(--i0); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important;} }

.proto-lead{font:11px/1.5 var(--mono); letter-spacing:.06em; color:#5d5d64; padding:12px 18px 0;}
#stage{min-height:100vh;}

/* ------------------------------------------------------------------- scène */
.sc{padding:16px clamp(12px,2.4vw,32px) 120px; max-width:1560px; margin:0 auto;
  display:flex; flex-direction:column; gap:12px;}
.card{background:var(--surf); border-radius:4px; box-shadow:0 0 0 1px var(--line);}
.card.flush{padding:0; overflow:hidden;}
.maphead{display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:14px 18px;}
.maphead h2{margin:0; font-size:14px; font-weight:600; letter-spacing:-.01em;}
.maphead .eng{font:500 11px/1 var(--mono); color:var(--i2); letter-spacing:.06em;
  text-transform:uppercase; background:var(--surf-2); padding:5px 9px; border-radius:999px;}
.legend{display:flex; gap:14px; flex-wrap:wrap; margin-left:auto;
  font-size:11.5px; color:var(--i2);}
.legend span{display:flex; align-items:center; gap:6px;}
.legend i{width:9px; height:3px; border-radius:2px; flex:none;}
.legend i.dot{width:9px; height:9px; border-radius:50%;}
.legend i.sq{width:9px; height:9px; border-radius:2px;}

/* -------------------------------------------------------------- conteneur */
.mapwrap{position:relative;}
#map{height:min(62vh,560px); min-height:320px; background:var(--map-void); outline:0;}
#map:focus-visible{box-shadow:inset 0 0 0 2px var(--i0);}

/* Le traitement porte sur les TUILES seules. Leaflet : le pane de tuiles.
   MapLibre : impossible en CSS (tuiles et tracés partagent le même canvas WebGL),
   c'est raster-saturation / raster-contrast / raster-brightness-max qui s'en charge. */
.leaflet-tile-pane{filter:var(--map-filter);}
.leaflet-container{background:var(--map-void); font-family:var(--mono); outline:0;}
.leaflet-div-icon{background:transparent !important; border:0 !important;}
.leaflet-control-attribution,.maplibregl-ctrl-attrib{
  background:rgba(9,9,11,.78) !important; color:var(--i2) !important;
  font:10px/1.5 var(--sans) !important;}
.leaflet-control-attribution a,.maplibregl-ctrl-attrib a{color:var(--i1) !important;}
.maplibregl-canvas{outline:0;}

/* repères : contraste plein, jamais filtrés */
.m-sat,.m-sta{display:flex; align-items:center; gap:6px; white-space:nowrap;
  font:700 11.5px/1 var(--mono); letter-spacing:-.02em; color:#fff;
  text-shadow:0 0 3px #000,0 0 3px #000,0 0 7px #000; pointer-events:none;}
.m-sat i{flex:none; width:9px; height:9px; border-radius:50%; background:var(--acc);
  box-shadow:0 0 0 1.5px rgba(0,0,0,.85);}
.m-sta i{flex:none; width:9px; height:9px; border:2px solid #fff; box-shadow:0 0 0 1.5px rgba(0,0,0,.85);}

/* --------------------------------------------------------- zoom accessible */
.zoomctl{position:absolute; top:10px; left:10px; z-index:600; display:flex; flex-direction:column; gap:4px;}
.zoomctl button{width:32px; height:32px; display:grid; place-items:center;
  font:500 17px/1 var(--sans); color:var(--i0); background:rgba(20,20,23,.9);
  border:1px solid var(--line); border-radius:4px; cursor:pointer;
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  transition-property:background-color,box-shadow; transition-duration:120ms; transition-timing-function:ease-out;}
.zoomctl button:hover{background:rgba(40,40,46,.95);}
.zoomctl button:focus-visible{outline:2px solid var(--i0); outline-offset:2px;}
@media (pointer:coarse){ .zoomctl button{width:44px; height:44px;} }

/* ------------------------------------------------------------------- HUD */
.hud{position:fixed; bottom:74px; left:14px; z-index:2147483645;
  padding:8px 11px; border-radius:9px; background:rgba(10,10,10,.87);
  -webkit-backdrop-filter:blur(12px) saturate(1.4); backdrop-filter:blur(12px) saturate(1.4);
  box-shadow:0 0 0 1px rgba(255,255,255,.08) inset;
  font:11px/1.45 var(--mono); color:rgba(255,255,255,.85); font-variant-numeric:tabular-nums;
  display:flex; gap:14px; align-items:baseline; pointer-events:none;}
.hud b{font-weight:500; color:rgba(255,255,255,.42); font-size:9.5px;
  letter-spacing:.1em; text-transform:uppercase; margin-right:5px;}
.hud .bad{color:#fb7185;} .hud .ok{color:#4ade80;}

/* ------------------------------------------------------ panneau (chrome) */
.panel{position:fixed; top:14px; right:14px; z-index:2147483646; width:272px;
  padding:11px 13px 13px; border-radius:12px;
  background:rgba(10,10,10,.87); -webkit-backdrop-filter:blur(12px) saturate(1.4); backdrop-filter:blur(12px) saturate(1.4);
  box-shadow:0 0 0 1px rgba(255,255,255,.08) inset, 0 8px 24px rgba(0,0,0,.24);
  font:12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:rgba(255,255,255,.82);
  max-height:calc(100vh - 28px); overflow:auto;}
.panel summary{cursor:pointer; list-style:none; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:rgba(255,255,255,.5); font-weight:600; display:flex; align-items:center; gap:7px; margin:0 0 10px;}
.panel summary::-webkit-details-marker{display:none;}
.panel summary::before{content:"▾"; font-size:9px;}
.panel:not([open]) summary{margin:0;}
.panel:not([open]) summary::before{content:"▸";}
.panel:not([open]){width:auto; padding:9px 13px;}
.panel summary:focus-visible{outline:2px solid rgba(255,255,255,.5); outline-offset:3px; border-radius:4px;}
.panel label{display:block; margin-bottom:10px;}
.panel .row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; gap:8px;}
.panel .row b{font-weight:500; font-size:11.5px;}
.panel .row span{font-family:ui-monospace,monospace; font-size:11px; color:rgba(255,255,255,.55); font-variant-numeric:tabular-nums;}
.panel input[type=range]{width:100%; margin:0; accent-color:#fff; height:18px;}
.panel label.chk{display:flex; align-items:center; gap:8px; margin-bottom:10px; cursor:pointer;}
.panel label.chk input{accent-color:#fff; width:14px; height:14px; margin:0;}
.panel label.chk b{font-weight:500; font-size:11.5px;}
.panel label.chk input:focus-visible{outline:2px solid rgba(255,255,255,.5); outline-offset:2px;}
.panel input[type=range]:focus-visible{outline:2px solid rgba(255,255,255,.5); outline-offset:2px;}
.panel .sep{margin:12px 0 10px; padding-top:10px; border-top:1px solid rgba(255,255,255,.1);
  font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.38); font-weight:600;}
.panel .out{margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,.1);
  font-family:ui-monospace,monospace; font-size:10.5px; line-height:1.55;
  color:rgba(255,255,255,.6); word-break:break-word;}
.panel .copy{width:100%; margin-top:8px; font:inherit; font-size:11px; padding:6px; border-radius:7px;
  background:rgba(255,255,255,.12); color:#fff; border:0; cursor:pointer;
  transition-property:background-color; transition-duration:120ms; transition-timing-function:ease-out;}
.panel .copy:hover{background:rgba(255,255,255,.2);}
.panel .copy:focus-visible{outline:2px solid rgba(255,255,255,.5); outline-offset:2px;}
@media (min-width:981px){ .sc{padding-right:302px;} }
@media (max-width:980px){ .panel{position:static; width:auto; margin:12px 18px 0; max-height:none;}
  /* le HUD reste fixe : c'est un instrument de mesure, il doit rester à l'écran */
  .hud{bottom:70px; right:14px; flex-wrap:wrap; gap:6px 12px; font-size:10px;} }
</style>
</head>
<body>

<div class="proto-lead">Prototype · carte — le moteur est au sélecteur, les réglages sont au panneau, les mesures sont en haut à gauche</div>
<div id="stage"></div>

<div class="hud" id="hud" aria-live="off">
  <span><b>ips</b><i id="h-fps">—</i></span>
  <span><b>tuiles</b><i id="h-tiles">0</i></span>
  <span><b>tuiles/s</b><i id="h-rate">0</i></span>
  <span><b>p95</b><i id="h-p95">—</i></span>
  <span><b>&gt;33 ms</b><i id="h-slow">0</i></span>
  <span><b>zoom</b><i id="h-zoom">—</i></span>
  <span><b>dernier geste</b><i id="h-gain">—</i></span>
</div>

<details class="panel" open>
  <summary>Réglages de la carte</summary>

  <label><span class="row"><b>Sensibilité molette</b><span id="v-wheel">250 px / niveau</span></span>
    <input type="range" id="wheel" min="40" max="600" step="10" value="250" aria-label="Sensibilité de la molette, en pixels par niveau de zoom"></label>

  <label><span class="row"><b>Sensibilité pincement</b><span id="v-pinch">60 px / niveau</span></span>
    <input type="range" id="pinch" min="10" max="300" step="5" value="60" aria-label="Sensibilité du pincement trackpad, en pixels par niveau de zoom"></label>

  <label><span class="row"><b>Inertie du glissé</b><span id="v-iner">2400 px/s²</span></span>
    <input type="range" id="iner" min="600" max="8000" step="100" value="2400" aria-label="Décélération de l'inertie, en pixels par seconde carrée"></label>

  <label class="chk"><input type="checkbox" id="noiner"><b>Couper l'inertie du glissé</b></label>

  <label><span class="row"><b>Zoom maximum</b><span id="v-zmax">17</span></span>
    <input type="range" id="zmax" min="8" max="19" step="1" value="17" aria-label="Niveau de zoom maximum"></label>

  <div class="row" style="margin-bottom:10px;"><b>Zoom minimum</b><span id="v-zmin">—</span></div>

  <div class="sep">Traitement des tuiles</div>
  <label><span class="row"><b>Saturation</b><span id="v-sat">0.00</span></span>
    <input type="range" id="sat" min="0" max="1" step="0.05" value="0" aria-label="Saturation des tuiles"></label>
  <label><span class="row"><b>Contraste</b><span id="v-con">1.16</span></span>
    <input type="range" id="con" min="0.7" max="1.8" step="0.02" value="1.16" aria-label="Contraste des tuiles"></label>
  <label><span class="row"><b>Luminosité</b><span id="v-bri">0.70</span></span>
    <input type="range" id="bri" min="0.3" max="1.2" step="0.02" value="0.7" aria-label="Luminosité des tuiles"></label>

  <div class="out" id="out">—</div>
  <button class="copy" id="copy" type="button">Copier les valeurs</button>
</details>

<nav class="proto-picker" aria-label="Moteur de carte">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Leaflet · actuel</button>
  <button class="proto-picker-item">Leaflet · réglé</button>
  <button class="proto-picker-item">Leaflet · molette réécrite</button>
  <button class="proto-picker-item">MapLibre GL</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Rejouer (R)">↻</button>
</nav>

<script src="../data/vendor/leaflet.js"></script>
<!-- PROTOTYPE UNIQUEMENT : à vendoriser (voir ensure_maplibre_js dans le rapport). -->
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script>
/* =========================================================================
   1. DONNÉES — les mêmes surcouches pour les trois moteurs.
   Orbite analytique (inclinaison 51,6°, 420 km, période 93 min) plutôt qu'un
   TLE : un prototype n'a pas besoin de SGP4 pour comparer des moteurs, et la
   charge de rendu est identique — même nombre de points, mêmes découpes.
   ========================================================================= */
var D = Math.PI / 180, RE = 6371;
var ORB = { inc: 51.6 * D, alt: 420, T: 5580, raan: 0.9, minEl: 5 };
var STA = { lat: 47.7719, lon: 7.3444, call: 'F4MAJ' };
var SAT_NAME = 'AO-91';
var IMAGERY = 'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
var LABELS  = 'https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}';
var ATTRIB  = 'Esri, Maxar, Earthstar Geographics';

function wrapLon(d) { return ((d + 180) % 360 + 360) % 360 - 180; }

function satAt(ms) {
  var s = ms / 1000, u = 2 * Math.PI * s / ORB.T;
  var lat = Math.asin(Math.sin(ORB.inc) * Math.sin(u));
  var lon = Math.atan2(Math.cos(ORB.inc) * Math.sin(u), Math.cos(u)) + ORB.raan - 2 * Math.PI * s / 86164;
  return { lat: lat / D, lon: wrapLon(lon / D) };
}

/* terminateur jour/nuit — repris tel quel de web/app.js */
function subsolar(now) {
  var d = (now / 86400000) - 10957.5;
  var g = (357.529 + 0.98560028 * d) * D;
  var q = 280.459 + 0.98564736 * d;
  var Lc = (q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * D;
  var dec = Math.asin(Math.sin(23.439 * D) * Math.sin(Lc)) / D;
  return { lat: dec, lon: wrapLon(180 - ((now / 3600000) % 24) * 15) };
}
function nightPolygon(now) {
  var s = subsolar(now), dec = s.lat;
  if (Math.abs(dec) < 0.2) dec = dec < 0 ? -0.2 : 0.2;
  var decR = dec * D, pts = [];
  for (var lon = -180; lon <= 180; lon += 4)
    pts.push([Math.atan(-Math.cos((lon - s.lon) * D) / Math.tan(decR)) / D, lon]);
  var pole = dec > 0 ? -90 : 90;
  pts.push([pole, 180], [pole, -180]);
  return pts;
}

/* découpe à l'antiméridien — polylignes (repris de web/app.js) */
function splitLine(points) {
  var segs = [], seg = [];
  for (var i = 0; i < points.length; i++) {
    var p = points[i];
    if (seg.length && Math.abs(p[1] - seg[seg.length - 1][1]) > 180) { segs.push(seg); seg = []; }
    seg.push(p);
  }
  if (seg.length) segs.push(seg);
  return segs;
}
/* découpe à l'antiméridien — anneau fermé : chaque moitié est refermée sur
   le méridien ±180, sinon l'empreinte radio se remplit en travers du monde. */
function splitRing(ring) {
  var segs = [], cur = [];
  for (var i = 0; i < ring.length; i++) {
    var p = ring[i];
    if (cur.length) {
      var q = cur[cur.length - 1], dl = p[1] - q[1];
      if (Math.abs(dl) > 180) {
        var side = dl > 0 ? -180 : 180;
        var f = (side - q[1]) / ((side - q[1]) + (p[1] + side));
        var lat = q[0] + (p[0] - q[0]) * f;
        cur.push([lat, side]); segs.push(cur); cur = [[lat, -side]];
      }
    }
    cur.push(p);
  }
  if (cur.length) segs.push(cur);
  if (segs.length > 1) { segs[0] = segs[segs.length - 1].concat(segs[0]); segs.pop(); }
  return segs;
}

function footprintRing(lat, lon) {
  var r = RE + ORB.alt, mE = ORB.minEl * D;
  var cap = Math.PI / 2 - mE - Math.asin((RE / r) * Math.cos(mE));
  var ring = [], la0 = lat * D, lo0 = lon * D;
  for (var a = 0; a <= 360; a += 3) {
    var br = a * D;
    var la = Math.asin(Math.sin(la0) * Math.cos(cap) + Math.cos(la0) * Math.sin(cap) * Math.cos(br));
    var lo = lo0 + Math.atan2(Math.sin(br) * Math.sin(cap) * Math.cos(la0),
                              Math.cos(cap) - Math.sin(la0) * Math.sin(la));
    ring.push([la / D, wrapLon(lo / D)]);
  }
  return ring;
}

/* l'unique source de vérité des surcouches, consommée par les trois moteurs */
function overlays(now) {
  var st = satAt(now);
  var past = [], future = [], dt;
  for (dt = -ORB.T * 1000; dt <= 0; dt += ORB.T * 1000 / 90) { var a = satAt(now + dt); past.push([a.lat, a.lon]); }
  for (dt = 0; dt <= ORB.T * 1000; dt += ORB.T * 1000 / 90) { var b = satAt(now + dt); future.push([b.lat, b.lon]); }
  var dLat = (st.lat - STA.lat) * D, dLon = (st.lon - STA.lon) * D;
  var c = 2 * Math.asin(Math.min(1, Math.sqrt(Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(STA.lat * D) * Math.cos(st.lat * D) * Math.sin(dLon / 2) * Math.sin(dLon / 2))));
  var r = RE + ORB.alt, mE = ORB.minEl * D;
  var audible = c < Math.PI / 2 - mE - Math.asin((RE / r) * Math.cos(mE));
  return {
    sat: [st.lat, st.lon], sta: [STA.lat, STA.lon], audible: audible,
    night: nightPolygon(now), past: splitLine(past), future: splitLine(future),
    foot: splitRing(footprintRing(st.lat, st.lon)),
    link: audible ? [[STA.lat, STA.lon], [st.lat, st.lon]] : []
  };
}

/* GeoJSON pour MapLibre : lat/lon -> lon/lat */
function flip(pair) { return [pair[1], pair[0]]; }
function mlLine(segs) { return { type: 'MultiLineString', coordinates: segs.map(function (s) { return s.map(flip); }) }; }
function mlPoly(rings) {
  return { type: 'MultiPolygon', coordinates: rings.map(function (r) {
    var c = r.map(flip);
    if (c.length && (c[0][0] !== c[c.length - 1][0] || c[0][1] !== c[c.length - 1][1])) c.push(c[0]);
    return [c];
  }) };
}

/* =========================================================================
   2. MESURES — un seul compteur pour la page, remis à zéro à chaque montage.
   ========================================================================= */
var MET = { tiles: 0, stamps: [], fps: 0, frames: [] };
try {
  new PerformanceObserver(function (l) {
    var e = l.getEntries();
    for (var i = 0; i < e.length; i++) if (/MapServer\/tile/.test(e[i].name)) {
      MET.tiles++; MET.stamps.push(performance.now());
    }
  }).observe({ type: 'resource', buffered: false });
} catch (e) { /* navigateur sans PerformanceObserver : les compteurs restent à 0 */ }

/* p95 et images lentes sur une fenêtre glissante — l'écart entre deux images
   consécutives, pas une moyenne : c'est la saccade qu'on cherche à voir. */
function frameStats(sinceMs) {
  var f = MET.frames, n = performance.now(), d = [], i;
  for (i = 1; i < f.length; i++) if (n - f[i] <= sinceMs) d.push(f[i] - f[i - 1]);
  if (!d.length) return { p95: 0, slow: 0, n: 0 };
  var slow = d.filter(function (x) { return x > 33; }).length;
  d.sort(function (a, b) { return a - b; });
  return { p95: d[Math.min(d.length - 1, Math.floor(d.length * 0.95))], slow: slow, n: d.length };
}

(function fpsLoop() {
  var frames = 0, last = performance.now();
  function tick(t) {
    frames++;
    MET.frames.push(t);
    if (MET.frames.length > 1500) MET.frames.splice(0, MET.frames.length - 1500);
    if (t - last >= 500) {
      MET.fps = Math.round(frames * 1000 / (t - last)); frames = 0; last = t;
      var n = performance.now();
      MET.stamps = MET.stamps.filter(function (s) { return n - s < 1000; });
      var f = document.getElementById('h-fps');
      f.textContent = MET.fps;
      f.className = MET.fps >= 50 ? 'ok' : (MET.fps < 30 ? 'bad' : '');
      document.getElementById('h-tiles').textContent = MET.tiles;
      document.getElementById('h-rate').textContent = MET.stamps.length;
      var fs = frameStats(2000);
      var p = document.getElementById('h-p95');
      p.textContent = fs.n ? fs.p95.toFixed(1) + ' ms' : '—';
      p.className = fs.p95 > 33 ? 'bad' : (fs.p95 && fs.p95 <= 20 ? 'ok' : '');
      var sl = document.getElementById('h-slow');
      sl.textContent = fs.slow;
      sl.className = fs.slow ? 'bad' : 'ok';
      document.getElementById('h-zoom').textContent = ENG && ENG.zoom ? ENG.zoom().toFixed(2) : '—';
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

/* Gain réel d'un geste : combien de niveaux de zoom pour combien de pixels de
   molette. C'est la mesure qui départage les moteurs — le réglage demandé au
   panneau n'est qu'une intention, celle-ci est ce que le moteur en fait. */
/* Une rafale = tout ce qui arrive à moins de 260 ms d'écart. On en sort cinq
   chiffres : niveaux gagnés, px de molette par niveau, tuiles chargées, dérive
   du point sous le curseur, et si c'était une molette ou un pincement. */
var GEST = { px: 0, z0: null, timer: null, pinch: false, ll: null, pt: null, t0: 0 };
document.addEventListener('wheel', function (e) {
  if (!ENG || !e.target.closest || !e.target.closest('.mapwrap')) return;
  if (GEST.z0 === null) {
    GEST.z0 = ENG.zoom(); GEST.px = 0; GEST.pinch = false; GEST.t0 = MET.tiles;
    var r = document.getElementById('map').getBoundingClientRect();
    GEST.pt = [e.clientX - r.left, e.clientY - r.top];
    GEST.ll = ENG.ptToLL(GEST.pt[0], GEST.pt[1]);
  }
  /* deltaMode normalisé ici aussi, sinon la mesure ment sur Firefox */
  var d = Math.abs(e.deltaY);
  if (e.deltaMode === 1) d *= 16; else if (e.deltaMode === 2) d *= 560;
  GEST.px += d;
  if (e.ctrlKey) GEST.pinch = true;
  clearTimeout(GEST.timer);
  GEST.timer = setTimeout(function () {
    var dz = Math.abs(ENG.zoom() - GEST.z0);
    var q = ENG.llToPt(GEST.ll[0], GEST.ll[1]);
    var drift = Math.hypot(q[0] - GEST.pt[0], q[1] - GEST.pt[1]);
    var el = document.getElementById('h-gain');
    el.textContent = (GEST.pinch ? 'pincement · ' : 'molette · ') +
      (dz < 0.01 ? '0 niv. (' + Math.round(GEST.px) + ' px perdus)'
                 : dz.toFixed(2) + ' niv. · ' + Math.round(GEST.px / dz) + ' px/niv.') +
      ' · ' + (MET.tiles - GEST.t0) + ' tuiles · ancrage ' + drift.toFixed(1) + ' px';
    el.className = dz < 0.01 ? 'bad' : (GEST.px / dz < 400 && drift < 4 ? 'ok' : 'bad');
    GEST.z0 = null;
  }, 260);
}, { capture: true, passive: true });

/* =========================================================================
   3. MOTEURS — même interface, trois implémentations.
   { draw(o) · wheel(px) · inertia(v) · zmax(z) · tint(s,c,b) · fitMin()
     · zoomIn() · zoomOut() · zoom() · minZoom() · worldPxW() · destroy() }
   ========================================================================= */
var ENG = null;
var reduce = matchMedia('(prefers-reduced-motion: reduce)');
function anim() { return !reduce.matches; }

/* ---------------------------------------------------------------- Leaflet */
function engineLeaflet(el, tuned, rw) {
  if (rw) tuned = true;                      /* « réécrite » = « réglé » + molette maison */
  var map = L.map(el, {
    /* « actuel » = la carte de production, mot pour mot. « réglé » = ce que
       Leaflet peut donner de mieux : pas de recopie du monde, zoom sans palier,
       et un minZoom recalculé sur la largeur réelle du conteneur. */
    worldCopyJump: !tuned,
    zoomSnap: tuned ? 0 : 0.25,
    zoomDelta: tuned ? 0.5 : 0.25,
    wheelPxPerZoomLevel: tuned ? 250 : 200,
    wheelDebounceTime: 40,
    /* la molette native est débranchée : elle sature à 4 niveaux par rafale
       (dz = 4·log2(2/(1+e^-|n|))) et wheelDebounceTime recoupe la rafale avant. */
    scrollWheelZoom: !rw,
    zoomAnimation: anim(),
    fadeAnimation: anim(),
    inertiaDeceleration: 2400,
    maxBoundsViscosity: tuned ? 1 : 0,
    zoomControl: false,
    attributionControl: true
  }).setView([STA.lat, STA.lon], 4);

  /* ---------------------------------------------------------------------
     MOLETTE RÉÉCRITE — ~25 lignes, aucune dépendance.
     Gain linéaire : dz = -deltaY / pxParNiveau. Pas de saturation, pas de
     debounce. deltaMode normalisé. ctrlKey = pincement trackpad macOS, qui a
     son propre facteur (les deltas y sont beaucoup plus fins). Le delta est
     accumulé et appliqué au plus une fois par image, ancré au curseur.
     --------------------------------------------------------------------- */
  var WH = { px: 250, pinch: 60 };
  var onWheel = null;
  if (rw) {
    var acc = 0, raf = 0, A = null, P = null, tLast = 0;
    /* L'ancre (point conteneur P, point géographique A) est figée pour toute
       la rafale. setZoomAround repartirait de l'état de la carte, dont
       l'origine en pixels est arrondie à chaque vue (_getNewPixelOrigin) :
       l'erreur est réinjectée puis multipliée par 2 à chaque niveau gagné —
       22 px de dérive sur 5 niveaux. Ici A→P est recalculé exactement à
       chaque image depuis une référence qui, elle, ne bouge pas. */
    var flush = function () {
      raf = 0;
      if (!acc || !A) return;
      var z = map.getZoom() + acc; acc = 0;
      z = Math.max(map.getMinZoom(), Math.min(map.getMaxZoom(), z));
      var half = map.getSize().divideBy(2);
      map.setView(map.unproject(map.project(A, z).subtract(P).add(half), z), z, { animate: false });
    };
    onWheel = function (e) {
      e.preventDefault();
      var t = e.timeStamp || performance.now();
      var pt = map.mouseEventToContainerPoint(e);
      /* nouvelle ancre si le pointeur a bougé ou si la rafale précédente est finie */
      if (!A || t - tLast > 250 || Math.abs(pt.x - P.x) > 2 || Math.abs(pt.y - P.y) > 2) {
        P = pt; A = map.containerPointToLatLng(pt);
      }
      tLast = t;
      var d = e.deltaY;
      if (e.deltaMode === 1) d *= 16;                       /* lignes */
      else if (e.deltaMode === 2) d *= el.clientHeight;     /* pages  */
      acc += -d / (e.ctrlKey ? WH.pinch : WH.px);           /* gain linéaire, sans palier */
      if (!raf) raf = requestAnimationFrame(flush);
    };
    el.addEventListener('wheel', onWheel, { passive: false });
  }

  var TO = { maxZoom: 19, updateWhenZooming: false, updateWhenIdle: false };
  if (tuned) {
    TO.noWrap = true;
    TO.bounds = [[-85.0511, -180], [85.0511, 180]];
    map.setMaxBounds([[-85.0511, -180], [85.0511, 180]]);
    /* socle permanent : le monde entier tient en 64 tuiles au zoom natif 3.
       Elles restent chargées, donc un zoom ne découvre jamais le conteneur nu. */
    L.tileLayer(IMAGERY, Object.assign({}, TO, { maxNativeZoom: 3, keepBuffer: 12 })).addTo(map);
  }
  var imagery = L.tileLayer(IMAGERY, Object.assign({}, TO, { keepBuffer: tuned ? 4 : 2, attribution: ATTRIB })).addTo(map);
  var labels  = L.tileLayer(LABELS,  Object.assign({}, TO, { keepBuffer: tuned ? 4 : 2 })).addTo(map);

  var night = L.polygon([], { stroke: false, fillColor: '#04080f', fillOpacity: .55, interactive: false }).addTo(map);
  var foot  = L.polygon([], { color: 'rgba(249,115,22,.6)', weight: 1.5, fillColor: '#f97316', fillOpacity: .10, interactive: false }).addTo(map);
  var past  = L.polyline([], { color: '#e4e4e7', weight: 2, opacity: .35, interactive: false }).addTo(map);
  var futr  = L.polyline([], { color: '#e4e4e7', weight: 2.5, opacity: .9, interactive: false }).addTo(map);
  var link  = L.polyline([], { color: '#f97316', weight: 1.5, opacity: .75, dashArray: '6,6', interactive: false }).addTo(map);
  var mSat  = L.marker([0, 0], { keyboard: false, icon: L.divIcon({ className: '', iconAnchor: [5, 10], html: '<div class="m-sat"><i></i>' + SAT_NAME + '</div>' }) }).addTo(map);
  var mSta  = L.marker([STA.lat, STA.lon], { keyboard: false, icon: L.divIcon({ className: '', iconAnchor: [5, 10], html: '<div class="m-sta"><i></i>' + STA.call + '</div>' }) }).addTo(map);

  function fitMin() {
    if (!tuned) return 0;                     /* la carte actuelle n'en a pas : c'est le défaut */
    var w = el.clientWidth, h = el.clientHeight;
    var z = Math.log2(Math.max(w, h) / 256);  /* le monde couvre le conteneur, jamais moins */
    map.setMinZoom(z);
    if (map.getZoom() < z) map.setZoom(z, { animate: false });
    return z;
  }
  var onResize = function () { map.invalidateSize(); fitMin(); };
  window.addEventListener('resize', onResize);

  return {
    kind: rw ? 'leaflet-rw' : 'leaflet', tuned: tuned, rw: !!rw, map: map,
    draw: function (o) {
      night.setLatLngs(o.night); past.setLatLngs(o.past); futr.setLatLngs(o.future);
      foot.setLatLngs(o.foot); link.setLatLngs(o.link); mSat.setLatLng(o.sat);
      foot.setStyle(o.audible
        ? { color: 'rgba(249,115,22,.65)', fillColor: '#f97316', fillOpacity: .13 }
        : { color: 'rgba(228,228,231,.45)', fillColor: '#e4e4e7', fillOpacity: .07 });
    },
    wheel: function (px) { WH.px = px; map.options.wheelPxPerZoomLevel = px; },
    /* Leaflet natif ne sait pas distinguer molette et pincement : un seul
       facteur pour les deux. Seule la variante réécrite honore celui-ci. */
    pinch: function (px) { WH.pinch = px; },
    inertia: function (v, off) { map.options.inertiaDeceleration = v; map.options.inertia = !off; },
    zmax: function (z) { map.setMaxZoom(z); },
    tint: function (s, c, b) {
      document.documentElement.style.setProperty('--map-sat', s);
      document.documentElement.style.setProperty('--map-con', c);
      document.documentElement.style.setProperty('--map-bri', b);
    },
    tintHow: 'filter CSS sur .leaflet-tile-pane',
    fitMin: fitMin,
    zoomIn: function () { map.zoomIn(1, { animate: anim() }); },
    zoomOut: function () { map.zoomOut(1, { animate: anim() }); },
    zoom: function () { return map.getZoom(); },
    minZoom: function () { return map.getMinZoom(); },
    worldPxW: function () { return 256 * Math.pow(2, map.getZoom()); },
    ptToLL: function (x, y) { var l = map.containerPointToLatLng([x, y]); return [l.lat, l.lng]; },
    llToPt: function (lat, lng) { var q = map.latLngToContainerPoint([lat, lng]); return [q.x, q.y]; },
    destroy: function () {
      window.removeEventListener('resize', onResize);
      if (onWheel) el.removeEventListener('wheel', onWheel, { passive: false });
      map.remove();
    }
  };
}

/* -------------------------------------------------------------- MapLibre GL */
function engineMaplibre(el) {
  var src = { type: 'raster', tiles: [IMAGERY], tileSize: 256, maxzoom: 17, attribution: ATTRIB };
  var map = new maplibregl.Map({
    container: el,
    /* renderWorldCopies:false — le monde est unique par construction, pas par
       réglage : au dézoom maximal on le voit une fois et on s'arrête là. */
    renderWorldCopies: false,
    attributionControl: { compact: true },
    center: [STA.lon, STA.lat], zoom: 3, maxZoom: 17,
    dragRotate: false, pitchWithRotate: false, touchZoomRotate: true,
    fadeDuration: anim() ? 300 : 0,
    style: {
      version: 8, sources: { img: src, lab: { type: 'raster', tiles: [LABELS], tileSize: 256, maxzoom: 17 } },
      layers: [
        /* fond peint : le conteneur nu n'est jamais visible, même avant la 1re tuile */
        { id: 'void', type: 'background', paint: { 'background-color': '#0b0f14' } },
        { id: 'img', type: 'raster', source: 'img', paint: {} },
        { id: 'lab', type: 'raster', source: 'lab', paint: {} }
      ]
    }
  });
  map.touchZoomRotate.disableRotation();

  var empty = { type: 'FeatureCollection', features: [] };
  var ready = false, pending = null;
  var mkSat = null, mkSta = null;

  map.on('load', function () {
    ['night', 'foot', 'past', 'futr', 'link'].forEach(function (id) { map.addSource(id, { type: 'geojson', data: empty }); });
    map.addLayer({ id: 'night', type: 'fill', source: 'night', paint: { 'fill-color': '#04080f', 'fill-opacity': .55 } });
    map.addLayer({ id: 'foot-f', type: 'fill', source: 'foot', paint: { 'fill-color': '#f97316', 'fill-opacity': .13 } });
    map.addLayer({ id: 'foot-l', type: 'line', source: 'foot', paint: { 'line-color': '#f97316', 'line-opacity': .65, 'line-width': 1.5 } });
    map.addLayer({ id: 'past', type: 'line', source: 'past', paint: { 'line-color': '#e4e4e7', 'line-opacity': .35, 'line-width': 2 } });
    map.addLayer({ id: 'futr', type: 'line', source: 'futr', paint: { 'line-color': '#e4e4e7', 'line-opacity': .9, 'line-width': 2.5 } });
    map.addLayer({ id: 'link', type: 'line', source: 'link', paint: { 'line-color': '#f97316', 'line-opacity': .75, 'line-width': 1.5, 'line-dasharray': [4, 4] } });

    var e1 = document.createElement('div'); e1.className = 'm-sat'; e1.innerHTML = '<i></i>' + SAT_NAME;
    var e2 = document.createElement('div'); e2.className = 'm-sta'; e2.innerHTML = '<i></i>' + STA.call;
    mkSat = new maplibregl.Marker({ element: e1, anchor: 'left' }).setLngLat([0, 0]).addTo(map);
    mkSta = new maplibregl.Marker({ element: e2, anchor: 'left' }).setLngLat([STA.lon, STA.lat]).addTo(map);

    ready = true;
    api.fitMin();
    applyPanel();               /* le style n'existait pas au montage : on repose les réglages */
    if (pending) { api.draw(pending); pending = null; }
  });

  function fitMin() {
    var w = el.clientWidth, h = el.clientHeight;
    /* MapLibre : le monde fait 512·2^z px. Même règle, autre base. */
    var z = Math.log2(Math.max(w, h) / 512);
    map.setMinZoom(z);
    if (map.getZoom() < z) map.setZoom(z);
    return z;
  }
  var onResize = function () { map.resize(); fitMin(); };
  window.addEventListener('resize', onResize);

  var api = {
    kind: 'maplibre', tuned: true, rw: false, map: map,
    draw: function (o) {
      if (!ready) { pending = o; return; }
      map.getSource('night').setData(mlPoly([o.night]));
      map.getSource('foot').setData(mlPoly(o.foot));
      map.getSource('past').setData(mlLine(o.past));
      map.getSource('futr').setData(mlLine(o.future));
      map.getSource('link').setData(mlLine(o.link.length ? [o.link] : []));
      mkSat.setLngLat(flip(o.sat));
      map.setPaintProperty('foot-f', 'fill-color', o.audible ? '#f97316' : '#e4e4e7');
      map.setPaintProperty('foot-f', 'fill-opacity', o.audible ? .13 : .07);
      map.setPaintProperty('foot-l', 'line-color', o.audible ? '#f97316' : '#e4e4e7');
    },
    /* wheelZoomRate = niveaux de zoom par pixel de molette : l'inverse exact
       du wheelPxPerZoomLevel de Leaflet, le même réglage s'y applique. */
    /* wheelZoomRate = niveaux par pixel de molette ; zoomRate est le facteur
       du pincement trackpad (ctrlKey) — MapLibre les sépare nativement, c'est
       exactement ce que la molette réécrite reproduit à la main. */
    wheel: function (px) { map.scrollZoom.setWheelZoomRate(1 / px); },
    pinch: function (px) { map.scrollZoom.setZoomRate(1 / px); },
    /* dragPan.enable() sort tout de suite si le gestionnaire est déjà actif :
       il faut le couper avant pour que les options soient reprises. */
    inertia: function (v, off) {
      map.dragPan.disable();
      map.dragPan.enable({ deceleration: off ? 1e9 : v });
    },
    zmax: function (z) { map.setMaxZoom(z); },
    /* Le canvas WebGL porte tuiles ET tracés : un filter CSS dessus décolorerait
       aussi les surcouches. Le traitement passe donc par les propriétés raster,
       qui ne s'appliquent qu'aux couches d'images. */
    tint: function (s, c, b) {
      if (!map.getLayer('img')) return;
      ['img', 'lab'].forEach(function (id) {
        map.setPaintProperty(id, 'raster-saturation', Math.max(-1, Math.min(1, s - 1)));
        map.setPaintProperty(id, 'raster-contrast', Math.max(-1, Math.min(1, c - 1)));
        map.setPaintProperty(id, 'raster-brightness-max', Math.max(0, Math.min(1, b)));
      });
    },
    tintHow: 'raster-saturation / raster-contrast / raster-brightness-max',
    fitMin: fitMin,
    zoomIn: function () { map.zoomIn({ animate: anim() }); },
    zoomOut: function () { map.zoomOut({ animate: anim() }); },
    zoom: function () { return map.getZoom(); },
    minZoom: function () { return map.getMinZoom(); },
    worldPxW: function () { return 512 * Math.pow(2, map.getZoom()); },
    ptToLL: function (x, y) { var l = map.unproject([x, y]); return [l.lat, l.lng]; },
    llToPt: function (lat, lng) { var q = map.project([lng, lat]); return [q.x, q.y]; },
    destroy: function () { window.removeEventListener('resize', onResize); map.remove(); }
  };
  return api;
}

/* =========================================================================
   4. VARIANTES — le même balisage partout. Seul le moteur monté diffère.
   1 actuel · 2 réglé · 3 molette réécrite (notre code) · 4 MapLibre GL.
   ========================================================================= */
var ENGINES = [
  { label: 'Leaflet 1.9.4 — réglages de production', build: function (el) { return engineLeaflet(el, false); } },
  { label: 'Leaflet 1.9.4 — noWrap + zoom continu', build: function (el) { return engineLeaflet(el, true); } },
  { label: 'Leaflet 1.9.4 — molette réécrite (0 dépendance)', build: function (el) { return engineLeaflet(el, true, true); } },
  { label: 'MapLibre GL JS 5.24 — WebGL, source raster', build: function (el) { return engineMaplibre(el); } }
];

function scene(i) {
  return '' +
  '<div class="sc"><div class="card flush">' +
    '<div class="maphead">' +
      '<h2>Carte du monde</h2>' +
      '<span class="eng">' + ENGINES[i].label + '</span>' +
      '<div class="legend">' +
        '<span><i class="dot" style="background:#f97316"></i>Satellite</span>' +
        '<span><i class="sq" style="border:2px solid #fff"></i>Station</span>' +
        '<span><i style="background:#e4e4e7"></i>Trace au sol</span>' +
        '<span><i class="sq" style="background:rgba(249,115,22,.35)"></i>Empreinte</span>' +
        '<span><i class="sq" style="background:#04080f;box-shadow:0 0 0 1px rgba(255,255,255,.2)"></i>Nuit</span>' +
      '</div>' +
    '</div>' +
    '<div class="mapwrap">' +
      '<div id="map" role="application" aria-label="Carte du monde — flèches pour se déplacer, plus et moins pour zoomer"></div>' +
      '<div class="zoomctl">' +
        '<button type="button" id="zi" aria-label="Zoom avant">+</button>' +
        '<button type="button" id="zo" aria-label="Zoom arrière">−</button>' +
      '</div>' +
    '</div>' +
  '</div></div>';
}

var variants = [
  function () { return scene(0); },
  function () { return scene(1); },
  function () { return scene(2); },
  function () { return scene(3); }
];

/* ------------------------------------------------------------- montage */
var drawTimer = null;
function mountMap(i) {
  if (ENG) { try { ENG.destroy(); } catch (e) {} ENG = null; }
  if (drawTimer) { clearInterval(drawTimer); drawTimer = null; }
  MET.tiles = 0; MET.stamps = [];
  var el = document.getElementById('map');
  if (!el) return;
  ENG = ENGINES[i].build(el);
  ENG.fitMin();
  var paint = function () { ENG.draw(overlays(Date.now())); };
  paint();
  drawTimer = setInterval(paint, 1000);          /* même cadence que la production */
  document.getElementById('zi').addEventListener('click', function () { ENG.zoomIn(); });
  document.getElementById('zo').addEventListener('click', function () { ENG.zoomOut(); });
  applyPanel();
}

/* --------------------------------------------------------------- panneau */
function n(id) { return +document.getElementById(id).value; }
function applyPanel() {
  var wheel = n('wheel'), pinch = n('pinch'), iner = n('iner'), zmax = n('zmax'),
      sat = n('sat'), con = n('con'), bri = n('bri');
  var noiner = document.getElementById('noiner').checked;
  document.getElementById('v-wheel').textContent = wheel + ' px / niveau';
  document.getElementById('v-pinch').textContent = pinch + ' px / niveau';
  document.getElementById('v-iner').textContent = noiner ? 'coupée' : iner + ' px/s²';
  document.getElementById('v-zmax').textContent = zmax;
  document.getElementById('v-sat').textContent = sat.toFixed(2);
  document.getElementById('v-con').textContent = con.toFixed(2);
  document.getElementById('v-bri').textContent = bri.toFixed(2);
  if (!ENG) return;
  ENG.wheel(wheel); ENG.pinch(pinch); ENG.inertia(iner, noiner); ENG.zmax(zmax); ENG.tint(sat, con, bri);
  var zmin = ENG.minZoom();
  document.getElementById('v-zmin').textContent =
    (isFinite(zmin) ? zmin.toFixed(2) : '—') + (ENG.tuned ? ' (calculé)' : ' (aucun)');
  document.getElementById('out').textContent =
    'moteur: ' + ENG.kind + ' · molette: ' + wheel + ' px/niveau · pincement: ' + pinch + ' px/niveau' +
    ' · inertie: ' + (noiner ? 'coupée' : iner + ' px/s²') +
    ' · zoom: ' + (isFinite(zmin) ? zmin.toFixed(2) : '0') + '→' + zmax +
    ' · tuiles: saturate(' + sat.toFixed(2) + ') contrast(' + con.toFixed(2) + ') brightness(' + bri.toFixed(2) + ')' +
    ' [' + ENG.tintHow + ']' +
    ' · monde recopié: ' + (ENG.tuned ? 'non' : 'oui');
}
['wheel', 'pinch', 'iner', 'zmax', 'sat', 'con', 'bri', 'noiner'].forEach(function (id) {
  document.getElementById(id).addEventListener('input', applyPanel);
});
document.getElementById('copy').addEventListener('click', function (e) {
  var t = document.getElementById('out').textContent;
  if (navigator.clipboard) navigator.clipboard.writeText(t);
  e.target.textContent = 'Copié ✓';
  setTimeout(function () { e.target.textContent = 'Copier les valeurs'; }, 1500);
});

/* sonde de mesure (Playwright) */
window.__probe = function () {
  return ENG ? {
    engine: ENG.kind + (ENG.rw ? ' réécrit' : ENG.tuned ? ' réglé' : ' actuel'),
    zoom: ENG.zoom(), minZoom: ENG.minZoom(), worldPxW: ENG.worldPxW(), tiles: MET.tiles
  } : {};
};
window.__mes = {
  ready: function () { return !!ENG && isFinite(ENG.zoom()); },
  set: function (id, v) {
    var el = document.getElementById(id);
    if (el.type === 'checkbox') el.checked = !!v; else el.value = v;
    applyPanel();
  },
  arm: function (z) {                       /* état de départ identique partout */
    ENG.map.setZoom(z, { animate: false });
    MET.tiles = 0; MET.stamps = []; MET.frames = [];
    return ENG.zoom();
  },
  read: function (ms) {
    var f = frameStats(ms || 3000);
    return { zoom: ENG.zoom(), tiles: MET.tiles, p95: f.p95, slow: f.slow, frames: f.n };
  },
  ptToLL: function (x, y) { return ENG.ptToLL(x, y); },
  llToPt: function (a) { return ENG.llToPt(a[0], a[1]); }
};
</script>
<script src="assets/picker.js"></script>
<script>
mount = function (i) {
  stage.innerHTML = '';
  requestAnimationFrame(function () { stage.innerHTML = variants[i](); mountMap(i); });
};
mount(current);
</script>
</body>
</html>
